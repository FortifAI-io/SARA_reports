function openModal(title, body, footer, wide) {
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = body;

}

function showToast(title, body, success) {

  $('#toast').classList.add('active');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => $('#toast').classList.remove('active'), 5000);
}

/* ============================================================
   T0 — PR INTAKE QUEUE
   ============================================================ */
function renderT0() {
  const isCarlos = STATE.persona === 'carlos';
  let prs = allPRs();

  // Sort: urgent first, then by stage priority
  const stageOrder = {
    'under_country_review': 1, 'ghbs_review_d7_exception': 2, 'bid_under_review_holds': 3,
    'bid_under_review_resolved': 4, 'ghbs_review_progress': 5, 'ghbs_review_new': 6, 'ghbs_review_rebid': 6,
    'renegotiation_in_progress': 7, 'awaiting_bids': 8, 'approved_awarded': 9
  };
  prs.sort((a, b) => {
    if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
    return (stageOrder[a.stage] || 99) - (stageOrder[b.stage] || 99);
  });

  // Filter counts
  const allCount     = prs.length;
  const ghbsCount    = prs.filter(p => p.stage.startsWith('ghbs_review')).length;
  const awaitCount   = prs.filter(p => p.stage === 'awaiting_bids').length;
  const underCount   = prs.filter(p => p.stage.startsWith('bid_under_review')).length;
  const countryCount = prs.filter(p => p.stage === 'under_country_review').length;
  const renegoCount  = prs.filter(p => p.stage === 'renegotiation_in_progress').length;
  const approvedCnt  = prs.filter(p => p.stage === 'approved_awarded').length;
  const urgentCount  = prs.filter(p => p.urgent).length;

  // Apply filter
  const f = STATE.decisionFilter;
  let filtered = prs;
  if (f === 'ghbs')      filtered = prs.filter(p => p.stage.startsWith('ghbs_review'));
  else if (f === 'await')filtered = prs.filter(p => p.stage === 'awaiting_bids');
  else if (f === 'under')filtered = prs.filter(p => p.stage.startsWith('bid_under_review'));
  else if (f === 'country')filtered = prs.filter(p => p.stage === 'under_country_review');
  else if (f === 'renego')filtered = prs.filter(p => p.stage === 'renegotiation_in_progress');
  else if (f === 'approved')filtered = prs.filter(p => p.stage === 'approved_awarded');
  else if (f === 'urgent')filtered = prs.filter(p => p.urgent);

  // (Item 2) Carlos hard filter — country PRs only, plus recent country-touched context (renegotiations + approved)
  if (isCarlos) {
    const carlosScopes = ['under_country_review', 'renegotiation_in_progress', 'approved_awarded'];
    prs = prs.filter(p => carlosScopes.includes(p.stage));
    // Apply Carlos-relevant sub-filter only
    if (f === 'country' || f === 'all') filtered = prs.filter(p => p.stage === 'under_country_review');
    else if (f === 'renego') filtered = prs.filter(p => p.stage === 'renegotiation_in_progress');
    else if (f === 'approved') filtered = prs.filter(p => p.stage === 'approved_awarded');
    else filtered = prs;
  }

  // Filter pill bar — Codex pattern (Maria gets full set; Carlos gets country-scoped only)
  let html = `<div class="filter-bar">
    <div class="filter-label">Stage:</div>`;
  if (isCarlos) {
    html += `
      <button class="fpill ${f === 'country' || f === 'all' ? 'on' : ''}" onclick="setDecisionFilter('country')">Awaiting My Decision (${countryCount})</button>
      <button class="fpill ${f === 'renego' ? 'on' : ''}" onclick="setDecisionFilter('renego')">In Renegotiation (${renegoCount})</button>
      <button class="fpill ${f === 'approved' ? 'on' : ''}" onclick="setDecisionFilter('approved')">Recently Approved (${approvedCnt})</button>
    </div>`;
  } else {
    html += `
      <button class="fpill ${f === 'all' ? 'on' : ''}" onclick="setDecisionFilter('all')">All (${allCount})</button>
      <button class="fpill ${f === 'ghbs' ? 'on' : ''}" onclick="setDecisionFilter('ghbs')">GHBS Review (${ghbsCount})</button>
      <button class="fpill ${f === 'await' ? 'on' : ''}" onclick="setDecisionFilter('await')">Awaiting Bids (${awaitCount})</button>
      <button class="fpill ${f === 'under' ? 'on' : ''}" onclick="setDecisionFilter('under')">Under Review (${underCount})</button>
      <button class="fpill ${f === 'country' ? 'on' : ''}" onclick="setDecisionFilter('country')">Country Review (${countryCount})</button>
      <button class="fpill ${f === 'renego' ? 'on' : ''}" onclick="setDecisionFilter('renego')">Renegotiation (${renegoCount})</button>
      <button class="fpill ${f === 'approved' ? 'on' : ''}" onclick="setDecisionFilter('approved')">Approved (${approvedCnt})</button>
      <button class="fpill ${f === 'urgent' ? 'on' : ''}" onclick="setDecisionFilter('urgent')" style="margin-left:auto;">Urgent (${urgentCount})</button>
    </div>`;
  }

  html += `<div class="card"><div class="card-bd np">
    <table class="tbl">
      <thead><tr>
        <th>PR / SAP SOURCE</th>
        <th>RFQ / PLANT</th>
        <th>Vendor scope · Mat. Group</th>
        <th class="r">Amount</th>
        <th class="r">AI Score</th>
        <th>Max sev</th>
        <th>D7</th>
        <th>Decision</th>
        <th>SLA</th>
        <th>Reviewer</th>
      </tr></thead>
      <tbody>`;

  for (const pr of filtered) {
    const isCountryAction = isCarlos && pr.stage === 'under_country_review';
    const rowClass = (pr.urgent ? 'urgent ' : '') + 'clickable';

    // Compute max sev from bid signals
    let maxSev = null;
    for (const b of pr.bids) for (const s of b.signals) {
      const sev = SIGNALS_CATALOG[s.code]?.severity;
      if (sev === 'Critical') maxSev = 'Critical';
      else if (sev === 'High' && maxSev !== 'Critical') maxSev = 'High';
      else if (sev === 'Medium' && !maxSev) maxSev = 'Medium';
    }
    const sevCell = maxSev ? `<span class="sev sev-${maxSev.toLowerCase()}">${maxSev}</span>` : '<span class="text-mid">—</span>';

    // Decision badge
    let decision = '';
    if (pr.stage.startsWith('ghbs_review')) decision = '<span class="dec dec-pending">In Review</span>';
    else if (pr.stage === 'awaiting_bids')  decision = '<span class="dec dec-pending">Awaiting</span>';
    else if (pr.stage === 'bid_under_review_holds')    decision = '<span class="dec dec-held">Held</span>';
    else if (pr.stage === 'bid_under_review_resolved') decision = '<span class="dec dec-cleared">Cleared</span>';
    else if (pr.stage === 'under_country_review')      decision = '<span class="dec dec-pending">Country Rev</span>';
    else if (pr.stage === 'renegotiation_in_progress') decision = '<span class="dec dec-held">Renegotiating</span>';
    else if (pr.stage === 'approved_awarded')          decision = '<span class="dec dec-cleared">Awarded</span>';

    // D7 — pass / fail summary
    let d7Cell = '<span class="text-mid">—</span>';
    const gs = pr.recommendedVendors.filter(v => BIDDERS[v]?.d7.status === 'gs').length;
    const am = pr.recommendedVendors.filter(v => BIDDERS[v]?.d7.status === 'am').length;
    if (pr.recommendedVendors.length > 0) {
      if (gs > 0) d7Cell = `<span class="dec dec-blocked">${gs} GS</span>`;
      else if (am > 0) d7Cell = `<span class="dec dec-held">${am} AM</span>`;
      else d7Cell = '<span class="dec dec-pass">PASS</span>';
    }

    // SLA in days
    const slaDays = pr.sla === 'green' ? '0d' : pr.sla === 'amber' ? '2d' : '5d';
    const slaCol = pr.sla === 'red' ? 'var(--crit)' : pr.sla === 'amber' ? 'var(--high)' : 'var(--status-approved)';

    // Reviewer — Maria for GHBS-stage, Carlos for country-stage
    const reviewer = (pr.stage === 'under_country_review' || pr.stage === 'approved_awarded' || pr.stage === 'renegotiation_in_progress') ? 'C. Mendoza' : 'M. Santos';

    html += `<tr class="${rowClass}" onclick="openPR('${pr.id}')">
      <td>
        <span class="pr-id">${pr.id}</span>
        <span class="pr-id-sub">${pr.sapPR}${pr.urgent ? '  ·  <span style="color:var(--crit);font-weight:700;"><i class="ti ti-flame" style="font-size:11px;"></i> URGENT</span>' : ''}</span>
      </td>
      <td>
        <span class="pr-rfq">${pr.rfqId || '<span style="color:var(--text3);">—</span>'}</span>
        <span class="pr-rfq-sub">${pr.plant}</span>
      </td>
      <td>
        <span class="v-name">${pr.title}</span>
        <span class="v-id">${pr.recommendedVendors.length} vendor${pr.recommendedVendors.length !== 1 ? 's' : ''} · <span class="mat-chip" style="font-size:9.5px;padding:1px 5px;">${getPRLineItems(pr).matGroup}</span></span>
      </td>
      <td class="r"><span class="amount">${fmtCurrM(pr.valuePHP).replace('PHP ', '').replace('$', '$')}</span><br><span class="pr-id-sub" style="text-align:right;">${STATE.currency}</span></td>
      <td class="r">${pr.bids.length > 0 ? aiScoreBadge(aiAwardRecommendation(pr).topScore.total) : (pr.stage.startsWith('ghbs_review') ? `<span class="ai-score ${aiPRRecommendation(pr).verdict === 'APPROVE' ? 'high' : aiPRRecommendation(pr).verdict === 'HOLD' ? 'mid' : 'low'}"><span class="ai-score-dot"></span>${aiPRRecommendation(pr).confidence}<span class="ai-badge sm" style="margin-left:2px;">AI</span></span>` : '<span class="text-mid">—</span>')}</td>
      <td>${sevCell}</td>
      <td>${d7Cell}</td>
      <td>${decision}${isCountryAction ? '  <span style="color:var(--crit);font-size:10px;font-family:DM Sans,monospace;font-weight:700;">↑ YOU</span>' : ''}</td>
      <td><span style="color:${slaCol};font-weight:600;font-family:DM Sans,monospace;">${slaDays}</span></td>
      <td><span style="font-size:12px;color:var(--text);">${reviewer}</span></td>
    </tr>`;
  }

  if (filtered.length === 0) {
    html += `<tr><td colspan="10" style="text-align:center;padding:36px;color:var(--text2);">No PRs match this filter.</td></tr>`;
  }

  html += '</tbody></table></div></div>';
  return html;
}

function countD7Flags(vendorIds) {
  let gs = 0, am = 0;
  for (const vid of vendorIds) {
    const v = BIDDERS[vid];
    if (!v) continue;
    if (v.d7.status === 'gs') gs++;
    else if (v.d7.status === 'am') am++;
  }
  if (gs === 0 && am === 0) return '<span style="color:var(--status-approved);">✓ All clear</span>';
  const parts = [];
  if (gs > 0) parts.push(`<span style="color:var(--crit);">${gs} GS</span>`);
  if (am > 0) parts.push(`<span style="color:var(--high);">${am} AM</span>`);
  return parts.join(' · ');
}

      <div>
        <div class="page-title" style="display:flex;align-items:center;gap:10px;">
          ${pr.urgent ? '<span class="urgent-flag" style="font-size:14px;background:var(--crit-bg);padding:3px 9px;border-radius:4px;"><i class="ti ti-flame"></i>URGENT</span>' : ''}
          ${pr.title}
        </div>
        <div class="page-subtitle">
          <span class="mono">${pr.sapPR}</span>
          ${pr.rfqId ? ' · <span class="mono" style="color:var(--brand-blue);">' + pr.rfqId + '</span>' : ''}
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        ${stageBadge(pr.stage)}
        ${!pr.urgent ? `<button class="btn btn-sm btn-ghost" onclick="markUrgent('${pr.id}')"><i class="ti ti-flame"></i>Mark Urgent</button>`
                     : `<button class="btn btn-sm btn-ghost" onclick="unmarkUrgent('${pr.id}')"><i class="ti ti-flame-off"></i>Clear Urgent</button>`}
        ${isPostRFQ ? `<button class="btn btn-sm btn-sec" onclick="viewRFQDoc('${pr.id}')"><i class="ti ti-file-text"></i>View RFQ Document</button>` : ''}
      </div>
    </div>
    ${pr.forwardedToCountryAt ? `
      <div style="background:linear-gradient(90deg, var(--brand-blue-bg) 0%, transparent 100%); border-left: 3px solid var(--brand-blue); padding: 10px 14px; margin-bottom: 16px; border-radius: 4px; display:flex; align-items:center; gap:10px;">
        <i class="ti ti-send" style="color: var(--brand-blue); font-size: 16px;"></i>
        <div style="font-size: 12.5px; color: var(--text);">
          <strong>Forwarded to Country Procurement</strong> on <span class="mono">${pr.forwardedToCountryAt}</span> by ${pr.forwardedToCountryBy}.
          Bid actions are now locked at GHBS; Carlos Mendoza is reviewing for award decision.
        </div>
      </div>` : ''}
  `;

  html += renderJourney(pr);

  html += `<div class="meta-strip">
    <div class="meta-cell"><div class="meta-l">Plant / Cost centre</div><div class="meta-v">${pr.plant}</div></div>
    <div class="meta-cell"><div class="meta-l">Category</div><div class="meta-v">${pr.category}</div></div>
    <div class="meta-cell"><div class="meta-l">Material Group</div><div class="meta-v"><span class="mat-chip">${getPRLineItems(pr).matGroup}</span></div></div>
    <div class="meta-cell"><div class="meta-l">Value</div><div class="meta-v">${fmtPHPm(pr.valuePHP)}</div></div>
    <div class="meta-cell"><div class="meta-l">Requested by</div><div class="meta-v" style="font-size:12px;">${pr.requestedBy}</div></div>
    <div class="meta-cell"><div class="meta-l">Raised</div><div class="meta-v">${pr.raisedDate}</div></div>
    ${pr.bidDeadline ? `<div class="meta-cell"><div class="meta-l">Bid deadline</div><div class="meta-v">${pr.bidDeadline}</div></div>` : ''}
  </div>`;

  // AI PR Approval Recommendation — visible only at the GHBS review stages where the decision is open
  if (pr.stage === 'ghbs_review_new' || pr.stage === 'ghbs_review_progress' || pr.stage === 'ghbs_review_d7_exception') {
    const aiPR = aiPRRecommendation(pr);
    const canRFQ = aiPR.verdict === 'APPROVE';
    html += `<div class="ai-rec-panel">
      <div class="ai-rec-h">
        <div class="ai-rec-h-l"><span class="ai-badge">AI</span>PR Approval Recommendation</div>
        <div class="ai-rec-conf">Model confidence <strong>${aiPR.confidence}%</strong> · explanation factors below</div>
      </div>
      <div class="ai-rec-verdict">
        Recommendation: <span class="ai-rec-verdict-tag ${aiPR.tagClass}">${aiPR.verdict}</span>
        ${canRFQ ? `<button class="ai-rec-btn" onclick="openRFQCreator('${pr.id}')"><i class="ti ti-wand"></i>Generate RFQ (one-click)</button>` : ''}
      </div>
      <div class="ai-rec-rationale">${aiPR.rationale}</div>
      <div class="ai-rec-factors">
        ${aiPR.factors.map(f => `<div class="ai-factor ${f.kind}"><i class="ti ti-${f.kind==='pos'?'circle-check':f.kind==='neg'?'circle-x':'circle-dot'}"></i>${f.text}</div>`).join('')}
      </div>
      <div class="ai-rec-actions">
        <button class="ai-rec-btn sec" onclick="explainAI('PR approval', '${pr.id}')"><i class="ti ti-bulb"></i>Explain in detail</button>
        <span style="font-size:10.5px;color:var(--text3);align-self:center;font-style:italic;">Reviewer decision overrides AI · all decisions logged to append-only audit trail</span>
      </div>
    </div>`;
  }

  // D7 exception banner
  if (pr.stage === 'ghbs_review_d7_exception') {
    html += `<div class="gate-panel gate-pending">
      <i class="ti ti-shield-exclamation gate-icon"></i>
      <div class="gate-body">
        <div class="gate-title">Vendor Validation — D7 Exception</div>
        <p>Two recommended vendors failed D7 screening. Review the vendor list below before issuing bid invitations. RFQ creation is blocked until vendors with Global Screening hits are either excluded or overridden with justification.</p>
      </div>
    </div>`;
  }

  // Requirement summary
  html += `<div class="card"><div class="card-hd"><div class="card-title">Requirement Summary</div></div>
    <div class="card-bd">
      <p class="text-sm" style="margin-top:0;">${getRequirementDescription(pr)}</p>
      <div class="row mt-3">
        <div class="col"><div class="meta-l">Material Group</div><div class="text-sm"><span class="mat-chip">${getPRLineItems(pr).matGroup}</span> ${getPRLineItems(pr).matGroupLabel}</div></div>
        <div class="col"><div class="meta-l">Delivery</div><div class="text-sm">${pr.plant}</div></div>
        <div class="col"><div class="meta-l">Country procurement note</div><div class="text-sm" style="font-style:italic;color:var(--text2);">"Prior PRs in this category for the same plant have followed similar specifications. Compare against historical pricing."</div></div>
      </div>
    </div>
  </div>`;

  // PR Line Items (Material Code + Group + Unit Price)
  const prCat = getPRLineItems(pr);
  if (prCat.items.length > 0) {
    const prTotal = prCat.items.reduce((s,i) => s + i.qty * i.unitPHP, 0);
    html += `<div class="card"><div class="card-hd">
      <div class="card-title">PR Line Items <span class="card-sub">— Material codes, units, indicative pricing</span></div>
      <div class="text-xs text-mid">Source: SAP MM · group <span class="mono">${prCat.matGroup}</span></div>
    </div>
    <div class="card-bd np">
      <table class="line-tbl">
        <thead><tr>
          <th style="width:160px;">Material Code</th>
          <th>Description</th>
          <th style="width:60px;">Unit</th>
          <th class="r" style="width:90px;">Qty</th>
          <th class="r" style="width:130px;">Unit Price (PHP)</th>
          <th class="r" style="width:140px;">Line Total (PHP)</th>
        </tr></thead>
        <tbody>
          ${prCat.items.map(i => `<tr>
            <td><span class="mat-code">${i.code}</span><span class="mat-grp">${prCat.matGroup}</span></td>
            <td>${i.desc}</td>
            <td class="mono">${i.unit}</td>
            <td class="r">${i.qty.toLocaleString('en-PH')}</td>
            <td class="r">${i.unitPHP.toLocaleString('en-PH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
            <td class="r">${(i.qty * i.unitPHP).toLocaleString('en-PH')}</td>
          </tr>`).join('')}
          <tr class="total-row">
            <td colspan="5" class="r">PR Indicative Total</td>
            <td class="r">${prTotal.toLocaleString('en-PH')}</td>
          </tr>
        </tbody>
      </table>
    </div></div>`;
  }

  // ──── RECOMMENDED VENDORS ────
  // Pre-RFQ stages allow editing; post-RFQ shows locked roster
  const isEditable = !isPostRFQ && pr.stage !== 'approved_awarded' && pr.stage !== 'renegotiation_in_progress';

  html += `<div class="card"><div class="card-hd">
    <div class="card-title">Recommended Vendors <span class="card-sub">— from SAP vendor master</span></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <span class="text-xs text-mid">D7 screening run · ${pr.recommendedVendors.length} vendors</span>
      ${isEditable ? `<button class="btn btn-sm btn-sec" onclick="openAddVendor('${pr.id}')"><i class="ti ti-plus"></i>Add vendor</button>` : ''}
    </div>
  </div>
  <div class="card-bd np">
    <table class="tbl">
      <thead><tr>
        <th>Vendor</th>
        <th>Tax ID · Country</th>
        <th>SAP Status</th>
        <th>D7 Screening</th>
        <th>Tender Pre-Bid Flags</th>
        ${isEditable ? '<th class="r">Action</th>' : ''}
      </tr></thead>
      <tbody>`;

  for (const vid of pr.recommendedVendors) {
    const v = BIDDERS[vid];
    if (!v) continue;
    const masterFlags = getMasterFlags(vid, pr.recommendedVendors);
    const amClearedHere = pr.d7Overrides?.[vid]?.type === 'am-cleared';
    let action = '';
    if (isEditable) {
      if (v.d7.status === 'gs')      action = `<button class="btn btn-sm btn-danger" onclick="overrideD7('${vid}','${pr.id}')"><i class="ti ti-ban"></i>Cannot include — Override</button>`;
      else if (v.d7.status === 'am' && !amClearedHere) action = `<button class="btn btn-sm btn-warn" onclick="reviewD7('${vid}','${pr.id}')"><i class="ti ti-alert-circle"></i>Review</button> <button class="btn btn-sm btn-ghost" onclick="removeVendor('${vid}','${pr.id}')" style="margin-left:4px;"><i class="ti ti-x"></i></button>`;
      else                            action = `<span style="color:var(--status-approved);font-size:11px;font-weight:600;">✓ Eligible</span> <button class="btn btn-sm btn-ghost" onclick="removeVendor('${vid}','${pr.id}')" style="margin-left:4px;"><i class="ti ti-x"></i></button>`;
    }
    html += `<tr>
      <td>
        <div style="font-weight:500;color:var(--text);">${v.name}</div>
        <div class="text-xs"><a onclick="openBidder('${vid}')" style="color:var(--deep-blue);cursor:pointer;">View profile ›</a></div>
      </td>
      <td><div class="mono">${v.taxId}</div><div class="text-xs text-mid">${v.country}</div></td>
      <td><div class="text-xs">Active</div><div class="text-xs text-mid">Setup ${v.setupDate}</div></td>
      <td>${d7Pill(v.d7, pr.id, vid)} ${(v.d7.status !== 'clear' && !amClearedHere) ? `<button class="btn btn-sm btn-ghost" style="margin-left:6px;padding:2px 8px;font-size:10px;" onclick="viewD7Detail('${vid}')">Details ›</button>` : ''}</td>
      <td class="text-xs">${masterFlags || '<span style="color:var(--status-approved);">None</span>'}</td>
      ${isEditable ? `<td class="r">${action}</td>` : ''}
    </tr>`;
  }
  html += '</tbody></table></div></div>';

  // ──── ISSUE RFQ ACTION (pre-RFQ stage) ────
  if (pr.stage.startsWith('ghbs_review')) {
    const blocked = pr.recommendedVendors.filter(v => BIDDERS[v]?.d7.status === 'gs').length;
    const eligible = pr.recommendedVendors.length - blocked;
    html += `<div class="card"><div class="card-hd"><div class="card-title">Issue Bid Invitations</div></div>
      <div class="card-bd">
        <p class="text-sm">When the vendor list is finalised, start the RFQ creation workflow. ${eligible} of ${pr.recommendedVendors.length} vendors currently eligible.</p>
        <div style="display:flex;gap:10px;align-items:center;margin-top:14px;">
          <button class="btn" ${blocked > 0 ? 'disabled' : ''} onclick="startIssueRFQ('${pr.id}')">
            ${blocked > 0 ? `<i class="ti ti-ban"></i>Cannot issue — ${blocked} GS hit unresolved` : `<i class="ti ti-send"></i>Start RFQ Issue Workflow (${eligible} vendors)`}
          </button>
          <span class="text-xs text-mid">2-step workflow: review → preview RFQ → issue</span>
        </div>
      </div>
    </div>`;
  }

  // ──── UNIFIED BID SECTION (post-RFQ) — replaces separate awaited/under-review screens ────
  if (isPostRFQ) {
    html += renderBidsSection(pr);

    // Submit to country action (when all bids resolved)
    if (pr.stage === 'bid_under_review_resolved' || (pr.bids.length > 0 && pr.bids.every(b => b.state === 'cleared') && pr.stage === 'bid_under_review_holds')) {
      html += `<div class="gate-panel gate-unlocked">
        <i class="ti ti-circle-check gate-icon"></i>
        <div class="gate-body">
          <div class="gate-title">Ready to Submit to Country Procurement</div>
          <p>All bids resolved. GHBS recommendation: <strong>${bidderName(pr.ghbsRecommendation || pr.bids.find(b => b.state==='cleared')?.bidder)}</strong>. ${pr.ghbsRecommendationRationale || ''}</p>
        </div>
        <button class="btn btn-success" onclick="startSubmitToCountry('${pr.id}')"><i class="ti ti-arrow-up-right"></i>Submit to Country</button>
      </div>`;
    }
  }

  // ──── RENEGOTIATION ────
  if (pr.stage === 'renegotiation_in_progress') {
    html += `<div class="gate-panel gate-pending">
      <i class="ti ti-arrows-exchange gate-icon"></i>
      <div class="gate-body">
        <div class="gate-title">Renegotiation in Progress</div>
        <p><strong>Country directive:</strong> "${pr.countryDecision.directive}"</p>
        <p style="margin-top:8px;color:var(--text2);">Status: ${pr.renegotiationStatus}</p>
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <button class="btn btn-sm btn-sec">Update Status</button>
        <button class="btn btn-sm btn-success" onclick="resubmitToCountry('${pr.id}')">Resubmit to Country</button>
      </div>
    </div>`;
  }

  // ──── APPROVED OUTCOME ────
  if (pr.stage === 'approved_awarded') {
    const d = pr.countryDecision;
    if (d.type === 'accept_different') {
      html += `<div class="gate-panel" style="background:#F4EAF7;border-color:#D9C0E2;">
        <i class="ti ti-arrows-right-left gate-icon" style="color:var(--status-override);"></i>
        <div class="gate-body">
          <div class="gate-title" style="color:var(--status-override);">Approved with Override — Country Selected Different Vendor</div>
          <div style="display:flex;gap:24px;margin:8px 0;">
            <div><div class="meta-l">GHBS recommended</div><div style="font-weight:600;">${bidderName(d.ghbsRecommended)}</div></div>
            <div><div class="meta-l">Country selected</div><div style="font-weight:600;color:var(--status-override);">${bidderName(d.selectedVendor)}</div></div>
          </div>
          <div class="text-sm" style="background:rgba(255,255,255,0.6);padding:10px;border-radius:4px;font-style:italic;">"${d.justification}"</div>
          <div class="text-xs text-mid" style="margin-top:6px;">Decided by ${d.decidedBy} on ${d.decidedAt} · Override flagged in audit trail</div>
        </div>
      </div>`;
    } else {
      html += `<div class="gate-panel gate-unlocked">
        <i class="ti ti-circle-check gate-icon"></i>
        <div class="gate-body">
          <div class="gate-title">Approved and Awarded</div>
          <p>Awarded to: <strong>${bidderName(d.selectedVendor || pr.ghbsRecommendation)}</strong> · Decided by ${d.decidedBy} on ${d.decidedAt}</p>
        </div>
      </div>`;
    }
  }

  return html;
}

function renderJourney(pr) {
  const steps = [
    { key: 'pr', label: 'PR from SAP', icon: 'ti-database' },
    { key: 'review', label: 'GHBS Review', icon: 'ti-eye' },
    { key: 'invite', label: 'RFQ Issued', icon: 'ti-send' },
    { key: 'screen', label: 'Bids Screened', icon: 'ti-shield-check' },
    { key: 'submit', label: 'Submit to Country', icon: 'ti-arrow-up-right' },
    { key: 'decide', label: 'Country Decision', icon: 'ti-gavel' },
    { key: 'award', label: 'Award / PO', icon: 'ti-check' }
  ];
  const stageMap = {
    'ghbs_review_new': 1, 'ghbs_review_progress': 1, 'ghbs_review_d7_exception': 1, 'ghbs_review_rebid': 1,
    'awaiting_bids': 3, 'bid_under_review_holds': 3, 'bid_under_review_resolved': 4,
    'under_country_review': 5, 'renegotiation_in_progress': 5, 'approved_awarded': 6
  };
  const currentIdx = stageMap[pr.stage] ?? 0;
  let html = '<div class="journey">';
  for (let i = 0; i < steps.length; i++) {
    const cls = i < currentIdx ? 'done' : (i === currentIdx ? 'current' : '');
    const icon = i < currentIdx ? 'ti-check' : steps[i].icon;
    html += `<div class="journey-step ${cls}"><i class="ti ${icon}"></i>${steps[i].label}</div>`;
    if (i < steps.length - 1) html += `<span class="journey-arrow">›</span>`;
  }
  html += '</div>';
  return html;
}

function renderBidsSection(pr) {
  // Unified section showing invitation roster + bid receipt status + signal details
  const invs = pr.invitations || [];
  const responded = invs.filter(i => i.status === 'responded').length;
  const totalInv = invs.length;
  const totalBids = pr.bids.length;
  const held = pr.bids.filter(b => b.state === 'held').length;
  const cleared = pr.bids.filter(b => b.state === 'cleared').length;
  const blocked = pr.bids.filter(b => b.state === 'blocked').length;
  const pending = totalInv - responded;

  let html = `<div class="card"><div class="card-hd">
    <div class="card-title">Bid Status <span class="card-sub">— ${pr.stage === 'awaiting_bids' ? 'Awaiting bids' : 'Under review'}</span></div>
    <div class="text-xs text-mid">${totalBids} of ${totalInv} bids received · ${held} held · ${cleared} cleared · ${blocked} blocked</div>
  </div>
  <div class="card-bd np">
    <table class="tbl">
      <thead><tr>
        <th>Vendor</th>
        <th>Invitation</th>
        <th>Bid Receipt</th>
        <th class="r">Amount (PHP)</th>
        <th class="r" style="width:110px;">AI Score</th>
        <th>State</th>
        <th>Signals Fired</th>
        <th class="r">Action</th>
      </tr></thead>
      <tbody>`;

  for (const inv of invs) {
    const v = BIDDERS[inv.vendor];
    const bid = pr.bids.find(b => b.bidder === inv.vendor);
    const invIconMap = { sent: 'ti-mail', opened: 'ti-mail-opened', responded: 'ti-mail-check' };
    const invLabelMap = { sent: 'Sent · not yet opened', opened: 'Opened · no response', responded: 'Responded' };
    const invColorMap = { sent: 'var(--text2)', opened: 'var(--high)', responded: 'var(--status-approved)' };

    let bidCell = '<span class="text-xs text-mid">—</span>';
    let amountCell = '<span class="text-mid">—</span>';
    let scoreCell = '<span class="text-xs text-mid">—</span>';
    let stateCell = bid ? '' : '<span class="badge b-waiting">Pending</span>';
    let signalsCell = '<span class="text-xs text-mid">—</span>';
    let actionCell = '';

    if (bid) {
      bidCell = `<div class="text-xs">${bid.submittedAt}</div>`;
      amountCell = `<span class="mono">${(bid.amountPHP/1000000).toFixed(2)}M</span>`;
      const s = aiBidScore(bid, pr);
      scoreCell = aiScoreBadge(s.total);
      const stateBadgeMap = { cleared: '<span class="badge b-approved">Cleared</span>', held: '<span class="badge b-progress">Held</span>', blocked: '<span class="badge b-exception">Blocked</span>' };
      stateCell = stateBadgeMap[bid.state] || bid.state;
      if (bid.signals.length === 0) {
        signalsCell = '<span class="text-xs text-mid">—</span>';
      } else {
        signalsCell = bid.signals.map(s => {
          const cat = SIGNALS_CATALOG[s.code];
          return `<div style="margin-bottom:4px;">${severityBadge(cat.severity)} <span style="font-size:11px;color:var(--text);">${cat.name}</span></div>`;
        }).join('');
      }
      if (bid.state === 'held' || bid.state === 'blocked') {
        actionCell = `<button class="btn btn-sm" onclick="viewBidEvidence('${pr.id}','${pr.bids.indexOf(bid)}')"><i class="ti ti-search"></i>Review</button>`;
      } else if (bid.state === 'cleared') {
        actionCell = '<span class="text-xs text-mid">Auto-cleared</span>';
      }
    }

    html += `<tr>
      <td>
        <div style="font-weight:500;color:var(--text);">${v.name}</div>
        <div class="text-xs text-mid">${v.country}</div>
      </td>
      <td>
        <div style="color:${invColorMap[inv.status]};font-size:11px;font-weight:500;display:flex;align-items:center;gap:4px;">
          <i class="ti ${invIconMap[inv.status]}"></i>${invLabelMap[inv.status]}
        </div>
        <div class="text-xs text-mid">${inv.sentAt} by ${inv.sentBy}</div>
      </td>
      <td>${bidCell}</td>
      <td class="r">${amountCell}</td>
      <td class="r">${scoreCell}</td>
      <td>${stateCell}</td>
      <td>${signalsCell}</td>
      <td class="r">${actionCell}</td>
    </tr>`;
  }

  html += '</tbody></table></div></div>';

  // ── AI Award Recommendation Panel (when bids received) ──
  if (pr.bids.length > 0 && (pr.stage === 'bid_under_review_holds' || pr.stage === 'bid_under_review_resolved' || pr.stage === 'country_review_pending')) {
    const aiAward = aiAwardRecommendation(pr);
    if (aiAward) {
      const topV = BIDDERS[aiAward.topBidder];
      html += `<div class="ai-rec-panel">
        <div class="ai-rec-h">
          <div class="ai-rec-h-l"><span class="ai-badge">AI</span>Bid Award Recommendation</div>
          <div class="ai-rec-conf">Model confidence <strong>${aiAward.confidence}%</strong> · explanation factors below</div>
        </div>
        <div class="ai-rec-verdict">
          Recommendation: <span class="ai-rec-verdict-tag ${aiAward.tagClass}">${aiAward.verdict}</span>
          <span style="font-size:12px;color:var(--text2);font-weight:400;">${aiAward.verdict === 'AWARD' ? `Suggested vendor: <strong style="color:var(--text);">${topV.name}</strong> · top score ${aiAward.topScore.total}/100` : ''}</span>
        </div>
        <div class="ai-rec-rationale">${aiAward.rationale}</div>
        <div class="ai-rec-factors">
          ${aiAward.factors.map(f => `<div class="ai-factor ${f.kind}"><i class="ti ti-${f.kind==='pos'?'circle-check':f.kind==='neg'?'circle-x':'circle-dot'}"></i>${f.text}</div>`).join('')}
        </div>
        <div class="ai-rec-actions">
          <button class="ai-rec-btn sec" onclick="explainAI('Bid award', '${pr.id}')"><i class="ti ti-bulb"></i>Explain score breakdown</button>
          <span style="font-size:10.5px;color:var(--text3);align-self:center;font-style:italic;">GHBS recommendation stays with Maria · AI score never auto-awards</span>
        </div>
      </div>`;
    }
  }

  // ── Bid Line-Item Comparison (when bids received) ──
  if (pr.bids.length > 0) {
    const prCat = getPRLineItems(pr);
    if (prCat.items.length > 0) {
      html += `<div class="card"><div class="card-hd">
        <div class="card-title">Bid Line-Item Comparison <span class="card-sub">— Per material code, per bidder, unit price comparison</span></div>
        <div class="text-xs text-mid">Group <span class="mono">${prCat.matGroup}</span> · ${pr.bids.length} bid${pr.bids.length === 1 ? '' : 's'}</div>
      </div>

function getMasterFlags(vid, allRec) {
  const v = BIDDERS[vid];
  const flags = [];
  for (const otherId of allRec) {
    if (otherId === vid) continue;
    const o = BIDDERS[otherId];
    if (!o) continue;
    if (o.address === v.address) flags.push(`<span style="color:var(--high);">Shared address with ${o.name.split(' ').slice(0,2).join(' ')}…</span>`);
  }
  const daysOld = (new Date('2026-06-15') - new Date(v.setupDate)) / (1000 * 60 * 60 * 24);
  if (daysOld < 365) flags.push('<span style="color:var(--olive);">New vendor (<1y)</span>');
  if (vid === 'V-PH-3082' || vid === 'V-PH-3041') flags.push('<span style="color:var(--olive);">Round-robin history (12-mo)</span>');
  return flags.join('<br>');
}

/* ============================================================

   ============================================================ */
function openAddVendor(prId) {
  const pr = PRS[prId];
  const existing = new Set(pr.recommendedVendors);
  // Filter to vendors that match category (rough heuristic via categories list)
  const candidates = Object.entries(BIDDERS).filter(([vid, v]) => !existing.has(vid) && v.categories.includes(pr.category));
  // Plus any vendor not in same category, marked
  const others = Object.entries(BIDDERS).filter(([vid, v]) => !existing.has(vid) && !v.categories.includes(pr.category));

  let body = `<div class="text-sm" style="margin-bottom:12px;">Add a vendor from the SAP vendor master to the recommended list for this PR.</div>
    <label>Filter</label>
    <input type="text" id="vendor-filter" placeholder="Vendor name or country…" onkeyup="filterAddVendor()">
    <div style="max-height:340px;overflow-y:auto;margin-top:12px;" id="add-vendor-list">`;

  const renderRow = (vid, v, matchCategory) => `
    <div class="add-v-row" data-vname="${v.name.toLowerCase()}" data-vcountry="${v.country.toLowerCase()}" style="display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--border);border-radius:4px;margin-bottom:6px;">
      <div style="flex:1;">
        <div style="font-weight:500;font-size:13px;">${v.name} ${matchCategory ? '' : '<span class="text-xs text-mid">(category mismatch)</span>'}</div>
        <div class="text-xs text-mid">${v.country} · ${v.taxId} · ${d7Pill(v.d7, prId, vid)}</div>
      </div>
      <button class="btn btn-sm" onclick="addVendor('${vid}','${PRS[prId].id ? prId : ''}','${prId}')"><i class="ti ti-plus"></i>Add</button>
    </div>`;

  if (candidates.length) {
    body += `<div class="text-xs text-bold text-mid" style="margin-bottom:6px;">Category match — ${pr.category}</div>`;
    for (const [vid, v] of candidates) body += renderRow(vid, v, true);
  }
  if (others.length) {
    body += `<div class="text-xs text-bold text-mid" style="margin:14px 0 6px;">Other vendors</div>`;
    for (const [vid, v] of others) body += renderRow(vid, v, false);
  }
  body += '</div>';

  openModal('Add Vendor from SAP Master', body, '<button class="btn btn-ghost" onclick="closeModal()">Close</button>');
}

function filterAddVendor() {
  const q = document.getElementById('vendor-filter').value.toLowerCase();
  $$('.add-v-row').forEach(r => {
    const match = r.dataset.vname.includes(q) || r.dataset.vcountry.includes(q);
    r.style.display = match ? '' : 'none';
  });
}

function addVendor(vid, _, prId) {
  const pr = PRS[prId];
  if (pr.recommendedVendors.includes(vid)) return;
  pr.recommendedVendors.push(vid);
  // Run D7 screening immediately
  const v = BIDDERS[vid];
  logAudit({ actor: 'Maria Santos', role: 'GHBS', module: 'Tender',
    action: 'Vendor added to PR · D7 screening run',
    detail: `${v.name} added to ${prId} · D7 result: ${v.d7.status.toUpperCase()}` });
  closeModal();
  render();
}

function removeVendor(vid, prId) {
  const v = BIDDERS[vid];
  const body = `
    <div class="text-sm" style="margin-bottom:12px;">Remove <strong>${v.name}</strong> from the recommended vendor list for this PR. Justification is mandatory and will be logged to the audit trail.</div>

function confirmReviewD7(vid, prId) {
  const decision = document.getElementById('am-decision').value;
  const justif = document.getElementById('am-justification').value;
  if (!justif.trim()) { alert('Justification is mandatory.'); return; }
  const v = BIDDERS[vid];
  const now = currentTime();

  if (decision === 'include') {
    // (Item 11) AM is context-dependent — record override on the PR, not on the vendor master
    const pr = PRS[prId];
    pr.d7Overrides = pr.d7Overrides || {};
    pr.d7Overrides[vid] = {
      type: 'am-cleared',
      by: 'Maria Santos',
      role: 'GHBS',
      at: now,
      amHitsReviewed: v.d7.am.length,
      justification: justif
    };
    logAudit({ actor: 'Maria Santos', role: 'GHBS', module: 'Tender',
      action: 'D7 AM reviewed — vendor INCLUDED (PR-scoped)',
      detail: `${v.name} · ${prId} · ${v.d7.am.length} AM hits reviewed and cleared for this PR only`,
      justification: justif });
  } else {
    // Exclude — drop from this PR's vendor list, no state change to master
    const pr = PRS[prId];
    pr.recommendedVendors = pr.recommendedVendors.filter(x => x !== vid);
    logAudit({ actor: 'Maria Santos', role: 'GHBS', module: 'Tender',
      action: 'D7 AM reviewed — vendor EXCLUDED',
      detail: `${v.name} · ${prId} · ${v.d7.am.length} AM hits`,
      justification: justif });
  }
  closeModal();
  render();
}

/* ============================================================
   T1 — HOLDS QUEUE
   ============================================================ */
function getHoldsQueue() {
  const holds = [];
  for (const p of allPRs()) {
    if (p.stage === 'bid_under_review_holds') {
      const heldBids = p.bids.filter(b => b.state === 'held' || b.state === 'blocked');
      if (heldBids.length > 0) {
        holds.push({ source: 'pr', prId: p.id, rfqId: p.rfqId, title: p.title, category: p.category, plant: p.plant,
          valuePHP: p.valuePHP, bidCount: p.bids.length, heldCount: heldBids.length, urgent: p.urgent,
          sla: p.sla, bidDeadline: p.bidDeadline,
          signals: heldBids.flatMap(b => b.signals.map(s => s.code)) });
      }
    }
  }
  for (const rfqId in RICH_SCENARIOS) {
    const sc = RICH_SCENARIOS[rfqId];
    const heldBids = sc.bids.filter(b => b.state === 'held' || b.state === 'blocked');
    if (heldBids.length === 0) continue;  // drop fully-cleared clusters from the queue
    holds.push({ source: 'scenario', prId: sc.prId, rfqId, title: sc.title, category: sc.category, plant: sc.plant,
      valuePHP: sc.valuePHP, bidCount: sc.bids.length, heldCount: heldBids.length, urgent: false,
      sla: 'green', bidDeadline: sc.bidDeadline,
      signals: heldBids.flatMap(b => b.signals.map(s => s.code)) });
  }
  return holds;
}

function renderT1() {
  const holds = getHoldsQueue();
  const isMaria = STATE.persona === 'maria';
  let html = `<div class="card"><div class="card-bd np">

      <th>RFQ / PR</th><th>Title</th><th>Category</th><th>Bids</th><th>Signals</th><th>SLA</th><th class="r">Action</th>
    </tr></thead><tbody>`;
  for (const h of holds) {
    const sevCounts = { Critical: 0, High: 0, Medium: 0 };
    h.signals.forEach(c => { const s = SIGNALS_CATALOG[c]; if (s) sevCounts[s.severity]++; });
    let sevHtml = '';
    if (sevCounts.Critical) sevHtml += `<span class="sev sev-critical">${sevCounts.Critical} Crit</span> `;
    if (sevCounts.High)     sevHtml += `<span class="sev sev-high">${sevCounts.High} High</span> `;

    const slaIcon = { green: '<i class="ti ti-circle-check" style="color:var(--status-approved);"></i>', amber: '<i class="ti ti-alert-triangle" style="color:var(--high);"></i>', red: '<i class="ti ti-alert-octagon" style="color:var(--crit);"></i>' }[h.sla];

    // (Item 16) Clear Hold action — Maria only, coarse-grained alternative to per-signal dispel
    const clearBtn = isMaria
      ? `<button class="btn btn-sm btn-success" style="margin-right:6px;" onclick="event.stopPropagation();clearHoldBulk('${h.rfqId}','${h.prId}')"><i class="ti ti-circle-check"></i>Clear Hold</button>`
      : '';
    html += `<tr class="clickable ${h.urgent ? 'urgent' : ''}" onclick="openCluster('${h.rfqId}','${h.prId}')">
      <td><span class="pr-id">${h.rfqId}</span><span style="font-size:11px;color:var(--text2);">${h.prId}</span></td>
      <td>
        ${h.urgent ? '<span class="urgent-flag" style="margin-right:6px;"><i class="ti ti-flame"></i>URGENT</span>' : ''}

  html += '</tbody></table></div></div>';

// (Item 17) Bulk Clear Hold — dispels all signals on all held bids of the PR, reusing the Issue-2 cascade
function clearHoldBulk(rfqId, prId) {
  if (STATE.persona !== 'maria') { alert('Clear Hold is GHBS-only.'); return; }
  // Look up the data container — PRS for live PRs, RICH_SCENARIOS for the seeded demo clusters
  const container = PRS[prId] || RICH_SCENARIOS[rfqId];
  if (!container) { alert('PR/RFQ data not found: ' + prId + ' / ' + rfqId); return; }
  const heldBids = (container.bids || []).filter(b => b.state === 'held');
  if (heldBids.length === 0) { alert('No held bids on this PR.'); return; }

  const titleStr = container.title || prId;
  const body = `
    <div class="text-sm" style="margin-bottom:12px;">Clear hold on <strong>${titleStr}</strong> (${rfqId}) in one action. This will:
      <ul style="margin:6px 0 6px 18px;color:var(--text2);font-size:12px;line-height:1.6;">
        <li>Dispel <strong>all signals</strong> on the <strong>${heldBids.length} held bid${heldBids.length > 1 ? 's' : ''}</strong> currently held in this cluster.</li>
        <li>Move ${heldBids.length > 1 ? 'each' : 'the'} bid state from <code>held</code> to <code>cleared</code>.</li>
        <li>Advance the PR through to Country Procurement once the bid deadline has passed.</li>
      </ul>
      Use this when you've reviewed the whole cluster and judged it a false-positive in aggregate. For signal-by-signal forensics, use the Review path instead.
    </div>
    <label>Reason code</label>
    <select id="bulk-reason-code">
      <option value="known-pattern">False positive — known vendor pattern</option>
      <option value="vendor-explained">Vendor explanation reviewed and verified</option>
      <option value="documentation">Documentation reviewed and acceptable</option>
      <option value="thresholds-loose">Signal thresholds too sensitive for this category</option>
      <option value="other">Other (specify in justification)</option>
    </select>
    <div style="margin-top:10px;">
      <label>Justification (mandatory, logged to audit)</label>
      <textarea id="bulk-justification" placeholder="Why is the entire hold a false positive?"></textarea>
    </div>
  `;
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn btn-success" onclick="confirmClearHoldBulk('${rfqId}','${prId}')"><i class="ti ti-circle-check"></i>Clear Hold</button>`;
  openModal('Clear Hold (bulk) — ' + titleStr, body, footer);
}

function confirmClearHoldBulk(rfqId, prId) {
  const reason = document.getElementById('bulk-reason-code').value;
  const justif = document.getElementById('bulk-justification').value;
  if (!justif.trim()) { alert('Justification is mandatory.'); return; }
  // Look up across both stores
  const container = PRS[prId] || RICH_SCENARIOS[rfqId];
  if (!container) { closeModal(); return; }
  const now = currentTime();
  const heldBids = (container.bids || []).filter(b => b.state === 'held');

  let signalsCleared = 0;
  heldBids.forEach(bid => {
    bid.signals.forEach(sig => {
      if (!sig.resolution) {
        sig.resolution = {
          status: 'dispelled',
          by: 'Maria Santos',
          role: 'GHBS',
          at: now,
          mode: 'bulk',
          reasonCode: reason,
          justification: justif
        };
        signalsCleared++;
      }
    });
    bid.state = 'cleared';
  });

  // Advance PR stage with deadline guard — only applies to PRS entries (RICH_SCENARIOS are demo seeds without lifecycle)
  let stageTransition = null;
  const pr = PRS[prId];
  if (pr && pr.stage === 'bid_under_review_holds') {
    const deadlinePassed = pr.bidDeadline ? (new Date(pr.bidDeadline) <= new Date(now)) : true;
    const newStage = deadlinePassed ? 'under_country_review' : 'bid_under_review_resolved';
    stageTransition = { from: pr.stage, to: newStage };
    pr.stage = newStage;
    if (newStage === 'under_country_review') {
      pr.forwardedToCountryAt = now;
      pr.forwardedToCountryBy = 'Maria Santos';
    }
  }

  logAudit({ actor: 'Maria Santos', role: 'GHBS', module: 'Tender',
    action: 'Hold cleared (bulk)',
    detail: `${rfqId} · ${heldBids.length} bid${heldBids.length > 1 ? 's' : ''} · ${signalsCleared} signal${signalsCleared > 1 ? 's' : ''} dispelled · reason: ${reason}` +
      (stageTransition ? ` · PR ${stageTransition.from} → ${stageTransition.to}` : ''),
    justification: justif });
  closeModal();
  render();
}

function reviewerAction(rfqId, bidIdx, sigCode, action) {
  const actionText = { confirm: 'Confirm Anomaly', dispel: 'Dispel Anomaly', info: 'Request More Information' }[action];
  let body = '';
  if (action === 'dispel') {
    body = `<div class="text-sm" style="margin-bottom:12px;">Dispelling this anomaly will release the bid. Justification is mandatory and immutably logged.</div>
      <label>Justification (mandatory)</label>
      <textarea id="action-justification" placeholder="Explain why this signal should be dispelled…"></textarea>`;
  } else if (action === 'confirm') {
    body = `<div class="text-sm" style="margin-bottom:12px;">Confirming this anomaly will disqualify the bid. An investigation case will be opened.</div>
      <label>Comment (optional)</label>
      <textarea id="action-justification" placeholder="Additional notes…"></textarea>`;
  } else {
    body = `<div class="text-sm" style="margin-bottom:12px;">Bid remains held; comment routed to bidder. SLA paused until response.</div>
      <label>Information requested</label>
      <textarea id="action-justification" placeholder="What information do you need from the bidder?"></textarea>`;
  }
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn ${action === 'confirm' ? 'btn-danger' : action === 'dispel' ? 'btn-success' : ''}" onclick="confirmReviewerAction('${rfqId}','${bidIdx}','${sigCode}','${action}')">${actionText}</button>`;
  openModal(actionText + ' — ' + sigCode, body, footer);
}

function confirmReviewerAction(rfqId, bidIdx, sigCode, action) {
  const justif = document.getElementById('action-justification').value;
  if (action === 'dispel' && !justif.trim()) { alert('Justification mandatory on Dispel.'); return; }
  const actionText = { confirm: 'Confirm Anomaly', dispel: 'Dispel Anomaly', info: 'Request More Information' }[action];
  const now = currentTime();

  // Find the data container — RICH_SCENARIOS for the seeded clusters, otherwise PRS
  const rfqData = RICH_SCENARIOS[rfqId] || PRS[STATE.currentPR];
  const bid = rfqData.bids[bidIdx];
  const v = BIDDERS[bid.bidder];
  const sig = bid.signals.find(s => s.code === sigCode);
  if (!sig) { closeModal(); return; }

  // (Item 5) Mark the signal with resolution metadata — keep it in array for audit completeness
  sig.resolution = {
    status: action === 'dispel' ? 'dispelled' : action === 'confirm' ? 'confirmed' : 'awaiting_bidder_info',
    by: 'Maria Santos',
    role: 'GHBS',
    at: now,
    justification: justif || null
  };

  // (Item 6) Recompute bid.state from signal resolutions
  const prevBidState = bid.state;
  const unresolved = bid.signals.filter(s => !s.resolution);
  const confirmed  = bid.signals.filter(s => s.resolution?.status === 'confirmed');
  const confirmedCritical = confirmed.some(s => SIGNALS_CATALOG[s.code]?.severity === 'Critical');
  if (confirmedCritical) bid.state = 'blocked';
  else if (unresolved.length > 0) bid.state = 'held';
  else if (confirmed.length > 0) bid.state = 'blocked';  // any confirmed anomaly disqualifies
  else bid.state = 'cleared';

  // (Item 7) Recompute pr.stage with deadline guard
  let stageTransition = null;
  const pr = PRS[STATE.currentPR];
  if (pr) {
    const allBids = pr.bids || [];
    const anyHeld = allBids.some(b => b.state === 'held');
    if (!anyHeld && pr.stage === 'bid_under_review_holds') {
      // All holds resolved — check deadline guard
      const deadlinePassed = pr.bidDeadline ? (new Date(pr.bidDeadline) <= new Date(now)) : true;
      const newStage = deadlinePassed ? 'under_country_review' : 'bid_under_review_resolved';
      stageTransition = { from: pr.stage, to: newStage };
      pr.stage = newStage;
      if (newStage === 'under_country_review') {
        pr.forwardedToCountryAt = now;
        pr.forwardedToCountryBy = 'Maria Santos';
      }
    }
  }

  // (Item 9) Audit entry captures both the action and the resulting state transition
  const auditDetail = `${rfqId} · Bidder: ${v.name} · ${SIGNALS_CATALOG[sigCode].name}` +
    (prevBidState !== bid.state ? ` → bid state ${prevBidState} → ${bid.state}` : '') +
    (stageTransition ? ` · PR ${stageTransition.from} → ${stageTransition.to}` : '');
  logAudit({ actor: 'Maria Santos', role: 'GHBS', module: 'Tender',
    action: `${actionText} — ${sigCode}`,
    detail: auditDetail,
    justification: justif || null });

  closeModal();
  // (Item 8) Full re-render so badges, hold counts, gate state all refresh consistently
  render();
}

function countryDecide(prId, type) {
  const pr = PRS[prId];
  let body = '', footer = '', title = '';
  if (type === 'accept') {
    title = 'Confirm: Accept and Move to PO';
    body = `<div class="text-sm" style="margin-bottom:12px;">You are approving the GHBS recommendation as-is. The RFQ will be awarded to <strong>${bidderName(pr.ghbsRecommendation)}</strong> at <strong>${fmtPHPm(pr.bids.find(b => b.bidder === pr.ghbsRecommendation).amountPHP)}</strong> and proceed to PO stage.</div>
      <label>Comment (optional)</label><textarea id="dec-comment" placeholder="Optional notes for the file…"></textarea>`;
    footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-success" onclick="confirmCountryDecision('${prId}','accept')">Confirm approval</button>`;
  } else if (type === 'reject') {
    title = 'Confirm: Reject and Rebid';
    body = `<div class="text-sm" style="margin-bottom:12px;">Rejecting will close this RFQ and return the PR to the GHBS queue for retender.</div>
      <label>Justification (mandatory)</label><textarea id="dec-comment" placeholder="Reason for rejection…"></textarea>`;
    footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmCountryDecision('${prId}','reject')">Reject and rebid</button>`;
  } else if (type === 'accept_different') {
    title = 'Confirm: Accept Bid, Different Vendor';
    const others = pr.bids.filter(b => b.bidder !== pr.ghbsRecommendation && b.state === 'cleared').map(b => {
      const v = BIDDERS[b.bidder];
      return `<option value="${b.bidder}">${v.name} — PHP ${(b.amountPHP/1000000).toFixed(2)}M</option>`;
    }).join('');
    body = `<div style="background:#F4EAF7;padding:12px;border-radius:4px;margin-bottom:14px;border-left:3px solid var(--status-override);">
      <div class="text-sm" style="font-weight:600;color:var(--status-override);"><i class="ti ti-alert-triangle"></i> Override transparency notice</div>
      <div class="text-xs mt-2">Selecting a different vendor than the GHBS recommendation will be flagged as an override in the audit trail with prominent visual treatment.</div>
    </div>
    <label>Alternative vendor</label><select id="dec-vendor">${others}</select>
    <div style="margin-top:10px;"><label>Justification (mandatory)</label><textarea id="dec-comment" placeholder="Explain why country is selecting a different vendor…"></textarea></div>`;
    footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-override" onclick="confirmCountryDecision('${prId}','accept_different')">Confirm override</button>`;
  } else if (type === 'renegotiate') {
    title = 'Confirm: Accept with Renegotiate';
    body = `<div class="text-sm" style="margin-bottom:12px;">You are approving the GHBS recommendation in principle but requiring GHBS to renegotiate specific terms before final award.</div>
      <label>Renegotiation directive (mandatory)</label><textarea id="dec-comment" placeholder="Specify what to renegotiate — price, payment terms, scope, etc."></textarea>`;
    footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-renego" onclick="confirmCountryDecision('${prId}','renegotiate')">Confirm renegotiate</button>`;
  }
  openModal(title, body, footer);
}

function confirmCountryDecision(prId, type) {
  const comment = document.getElementById('dec-comment').value;
  if (type !== 'accept' && !comment.trim()) { alert('Justification mandatory.'); return; }
  const pr = PRS[prId];
  const now = '2026-06-15 ' + new Date().toTimeString().substring(0,5);

  if (type === 'accept') {
    pr.countryDecision = { type: 'accept', decidedAt: now, decidedBy: 'Carlos Mendoza', selectedVendor: pr.ghbsRecommendation };
    pr.stage = 'approved_awarded';
    logAudit({ actor: 'Carlos Mendoza', role: 'Country', module: 'Tender',
      action: 'Country decision: ACCEPT AND MOVE TO PO',
      detail: `${pr.rfqId} · Awarded: ${bidderName(pr.ghbsRecommendation)}`, justification: comment || null });
  } else if (type === 'reject') {
    pr.countryDecision = { type: 'reject', decidedAt: now, decidedBy: 'Carlos Mendoza', justification: comment };
    pr.stage = 'ghbs_review_rebid'; pr.bids = []; pr.rfqId = null; pr.invitations = null;
    logAudit({ actor: 'Carlos Mendoza', role: 'Country', module: 'Tender',
      action: 'Country decision: REJECT AND REBID',
      detail: `${prId} returned to GHBS for retender`, justification: comment });
  } else if (type === 'accept_different') {
    const alt = document.getElementById('dec-vendor').value;
    pr.countryDecision = { type: 'accept_different', decidedAt: now, decidedBy: 'Carlos Mendoza',
      selectedVendor: alt, ghbsRecommended: pr.ghbsRecommendation, justification: comment };
    pr.stage = 'approved_awarded';
    logAudit({ actor: 'Carlos Mendoza', role: 'Country', module: 'Tender',
      action: 'Country decision: ACCEPT BID, DIFFERENT VENDOR (override)',
      detail: `${pr.rfqId} · Selected ${bidderName(alt)} instead of GHBS-recommended ${bidderName(pr.ghbsRecommendation)}`,
      justification: comment, override: true });
  } else if (type === 'renegotiate') {
    pr.countryDecision = { type: 'renegotiate', decidedAt: now, decidedBy: 'Carlos Mendoza',
      directive: comment, selectedVendor: pr.ghbsRecommendation };
    pr.stage = 'renegotiation_in_progress';
    pr.renegotiationStatus = 'Just initiated — pending GHBS action';
    logAudit({ actor: 'Carlos Mendoza', role: 'Country', module: 'Tender',
      action: 'Country decision: ACCEPT WITH RENEGOTIATE',
      detail: `${pr.rfqId} · Renegotiation directive issued`, justification: comment });
  }
  closeModal();
  navigate('t0');
}

// (Item 19) Executive KPI computation — reads existing data, simulates prior-period deltas
function calcExecKPIs() {
  const all = allPRs();
  const richBids = [];
  for (const k in RICH_SCENARIOS) for (const b of RICH_SCENARIOS[k].bids) richBids.push(b);

  const totalValuePHP = all.reduce((s, p) => s + (p.valuePHP || 0), 0);

  // Value Protected — blocked + held bids across PRS + RICH_SCENARIOS
  const blockedBids = [], heldBids = [];
  all.forEach(p => (p.bids || []).forEach(b => {
    if (b.state === 'blocked') blockedBids.push(b);
    if (b.state === 'held') heldBids.push(b);
  }));
  richBids.forEach(b => {
    if (b.state === 'blocked') blockedBids.push(b);
    if (b.state === 'held') heldBids.push(b);
  });
  const protectedValue = [...blockedBids, ...heldBids].reduce((s, b) => s + (b.amountPHP || 0), 0);

  // Hold SLA — bids whose PR has progressed past holds counted as resolved-within-SLA (78% mock)
  const resolvedHolds = all.filter(p =>
    p.stage === 'bid_under_review_resolved' || p.stage === 'under_country_review' || p.stage === 'approved_awarded'
  ).reduce((s, p) => s + (p.bids?.filter(b => b.state === 'cleared').length || 0), 0);
  const totalHolds = heldBids.length + resolvedHolds;
  const withinSla = Math.round(resolvedHolds * 0.92 + heldBids.length * 0.4);

  const allVendors = Object.values(BIDDERS);
  const screened = allVendors.length;
  const blockedV = allVendors.filter(v => v.d7.status === 'gs').length;

  const decidedPRs    = all.filter(p => p.countryDecision);
  const overriddenPRs = all.filter(p => p.countryDecision?.type === 'accept_different');

  const k = calcKPIs();

  return {
    prsEvaluated:    { count: all.length, valueM: 'PHP ' + (totalValuePHP / 1e6).toFixed(1) + 'M', delta: 12 },
    valueProtected:  { valueM: 'PHP ' + (protectedValue / 1e6).toFixed(1) + 'M', blocked: blockedBids.length, held: heldBids.length, delta: 23 },
    holdSla:         { pct: totalHolds === 0 ? 100 : Math.round((withinSla / totalHolds) * 100), withinSla, total: totalHolds, delta: 4 },
    d7BlockRate:     { pct: screened === 0 ? 0 : Math.round((blockedV / screened) * 100), blocked: blockedV, screened, delta: 2 },
    countryOverride: { pct: decidedPRs.length === 0 ? 0 : Math.round((overriddenPRs.length / decidedPRs.length) * 100), overridden: overriddenPRs.length, total: decidedPRs.length, delta: -3 },
    cycleTime:       { days: k.avgTurnDays || 7, delta: -1 }
  };
}

// Lookup: for a given vendor, find every PR they've been invited to and the state per invitation
function getVendorActivity(vendorId) {
  const activity = { active: [], closed: [] };
  for (const [prId, pr] of Object.entries(PRS)) {
    if (!pr.invitations) continue;
    const inv = pr.invitations.find(i => i.vendor === vendorId);
    if (!inv) continue;
    const bid = (pr.bids || []).find(b => b.bidder === vendorId);
    const record = {
      prId, rfqId: pr.rfqId || '—', prTitle: pr.title, stage: pr.stage,
      sentAt: inv.sentAt, sentBy: inv.sentBy, invStatus: inv.status,
      bid: bid ? { amount: bid.amountPHP, submittedAt: bid.submittedAt, state: bid.state, signals: bid.signals } : null,
      deadline: pr.bidDeadline || null,
      countryDecision: pr.countryDecision
    };
    const isActive = pr.stage === 'awaiting_bids' || pr.stage === 'bid_under_review_holds';
    if (isActive) activity.active.push(record); else activity.closed.push(record);
  }
  return activity;
}

function vendorActivitySummary(vendorId) {
  const a = getVendorActivity(vendorId);
  const allInv = a.active.length + a.closed.length;
  const uploaded = [...a.active, ...a.closed].filter(r => r.bid).length;
  const pending = a.active.filter(r => !r.bid).length;
  return { allInv, uploaded, pending, active: a.active.length, closed: a.closed.length };
}

function vendorMasterAction(vid, action) {
  if (STATE.persona !== 'maria') {

  }
  const v = BIDDERS[vid];
  if (!v) return;
  const titleMap = {
    clearAM: 'Clear AM globally — ' + v.name,
    hold: 'Hold vendor — ' + v.name,
    block: 'Block vendor permanently — ' + v.name,
    clearHold: 'Clear hold — ' + v.name,
    reactivate: 'Reactivate vendor — ' + v.name
  };
  const promptMap = {
    clearAM: `<div class="text-sm" style="margin-bottom:12px;"><strong>${v.name}</strong> has <strong>${v.d7.am.length} adverse media hit${v.d7.am.length > 1 ? 's' : ''}</strong>. Clearing AM globally will allow this vendor to be invited to <em>all future RFQs</em> without re-review of the existing AM findings. This is a vendor-master change — distinct from PR-scoped overrides.</div>`,
    hold: `<div class="text-sm" style="margin-bottom:12px;">Holding <strong>${v.name}</strong> will prevent the vendor from being auto-invited to RFQs pending GHBS investigation. Hold is reversible.</div>`,
    block: `<div class="text-sm" style="margin-bottom:12px;background:var(--crit-bg);padding:10px;border-radius:4px;border-left:3px solid var(--crit);">Blocking <strong>${v.name}</strong> is a <strong>permanent</strong> exclusion from RFQ invitations until explicit reactivation. Use only for confirmed misconduct or compliance failure.</div>`,
    clearHold: `<div class="text-sm" style="margin-bottom:12px;">Clearing the hold on <strong>${v.name}</strong> will return the vendor to active status and allow future RFQ invitations.</div>`,
    reactivate: `<div class="text-sm" style="margin-bottom:12px;">Reactivating <strong>${v.name}</strong> will lift the block. Use only after underlying compliance concerns have been formally resolved.</div>`
  };
  const body = promptMap[action] +
    `<label>Justification (mandatory, logged to audit)</label>
     <textarea id="vma-justification" placeholder="Reason for this vendor-master change…"></textarea>`;
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn ${action === 'block' ? 'btn-danger' : action === 'clearHold' || action === 'clearAM' ? 'btn-success' : ''}" onclick="confirmVendorMasterAction('${vid}','${action}')">Confirm</button>`;
  openModal(titleMap[action], body, footer);
}

function confirmVendorMasterAction(vid, action) {
  const justif = document.getElementById('vma-justification').value;
  if (!justif.trim()) { alert('Justification is mandatory.'); return; }
  const v = BIDDERS[vid];
  const now = currentTime();
  const v_old = { holdStatus: v.holdStatus || 'active', amClearedGlobally: v.d7.amClearedGlobally || false };

  if (action === 'clearAM') {
    v.d7.amClearedGlobally = true;
    v.d7.amClearanceContext = { by: 'Maria Santos', role: 'GHBS', at: now, amHits: v.d7.am.length, justification: justif };
  } else if (action === 'hold') {
    v.holdStatus = 'held';
    v.holdReason = justif;
    v.holdContext = { by: 'Maria Santos', role: 'GHBS', at: now };
  } else if (action === 'block') {
    v.holdStatus = 'blocked';
    v.holdReason = justif;
    v.holdContext = { by: 'Maria Santos', role: 'GHBS', at: now };
  } else if (action === 'clearHold' || action === 'reactivate') {
    v.holdStatus = 'active';
    v.holdReason = null;
    v.holdContext = { by: 'Maria Santos', role: 'GHBS', at: now, clearedFrom: v_old.holdStatus };
  }

  const actionLabel = {
    clearAM:    'Vendor AM cleared globally',
    hold:       'Vendor placed on HOLD',
    block:      'Vendor BLOCKED permanently',
    clearHold:  'Vendor hold CLEARED',
    reactivate: 'Vendor REACTIVATED'
  }[action];
  logAudit({ actor: 'Maria Santos', role: 'GHBS', module: 'Tender',
    action: actionLabel,
    detail: `${v.name} (${vid}) · vendor master update`,
    justification: justif, override: (action === 'clearAM' || action === 'block' || action === 'reactivate') });
  closeModal();
  render();
}

function renderCountryDossier(pr) {
  const stageReadable = stageBadge(pr.stage);
  const bids = pr.bids || [];
  const clearedBids = bids.filter(b => b.state === 'cleared').sort((a,b) => a.amountPHP - b.amountPHP);
  const topBid = clearedBids[0];
  const topVendor = topBid ? BIDDERS[topBid.bidder] : null;
  const totalBids = bids.length;

  // Roll up signal severity counts across all bids
  const sevRollup = { Critical: 0, High: 0, Medium: 0 };
  bids.forEach(b => (b.signals || []).forEach(s => {
    const sig = SIGNALS_CATALOG[s.code];
    if (sig) sevRollup[sig.severity] = (sevRollup[sig.severity] || 0) + 1;
  }));

  // GHBS recommendation (mocked from data — top cleared bid + bid count + signal cluster)
  const ghbsRec = topBid
    ? `Award to <strong>${topVendor.name}</strong> at <span class="mono">${fmtPHP(topBid.amountPHP)}</span>. ${clearedBids.length} of ${totalBids} bids cleared the integrity screen.`

      <div>${stageReadable}</div>

    <!-- GHBS hand-off banner -->

      <div style="font-size: 13px; font-weight: 600; color: var(--text);"><i class="ti ti-send"></i> Handed off by GHBS · ${pr.forwardedToCountryAt || pr.rfqIssuedDate || '—'}</div>
      <div style="font-size: 12px; color: var(--text2); margin-top: 4px;">${pr.forwardedToCountryBy || 'Maria Santos'} (GHBS) completed integrity review. ${pr.bids?.length || 0} bids evaluated, ${clearedBids.length} cleared, ${(pr.bids?.length || 0) - clearedBids.length} held/blocked. Country review required for final award authorisation.</div>

      <div class="kpi"><div class="kpi-lbl"><i class="ti ti-users"></i>Bids Cleared</div><div class="kpi-val">${clearedBids.length} <span style="font-size:14px;color:var(--text3);">/ ${totalBids}</span></div><div class="kpi-sub">${bids.length - clearedBids.length} held/blocked</div></div>
      <div class="kpi ${sevRollup.Critical > 0 ? 'crit' : sevRollup.High > 0 ? 'high' : 'good'}"><div class="kpi-lbl"><i class="ti ti-flag"></i>Signals Surfaced</div><div class="kpi-val">${sevRollup.Critical + sevRollup.High + sevRollup.Medium}</div><div class="kpi-sub">${sevRollup.Critical}C · ${sevRollup.High}H · ${sevRollup.Medium}M</div></div>
    </div>

    <!-- Bid comparison -->
    <div class="card" style="margin-bottom:14px;"><div class="card-hd"><div class="card-title">Bid comparison — cleared bids only</div></div>

      <table class="tbl">
        <thead><tr><th>Vendor</th><th>Country</th><th class="r">Bid (PHP)</th><th class="r">% above lowest</th><th>D7</th><th>Submitted</th></tr></thead>

  if (clearedBids.length === 0) {

        </div>

      <div class="card"><div class="card-hd"><div class="card-title">Signal cluster summary</div></div>
        <div class="card-bd">
          ${(sevRollup.Critical + sevRollup.High + sevRollup.Medium) === 0
            ? '<div style="color:var(--status-approved);font-size:12px;"><i class="ti ti-circle-check"></i> No signals fired across the cluster — GHBS evaluation completed clean.</div>'
            : `<div style="font-size:11.5px;color:var(--text2);margin-bottom:6px;">${sevRollup.Critical + sevRollup.High + sevRollup.Medium} signals fired during GHBS evaluation. All resolved before hand-off.</div>

    <!-- Action panel -->
    <div class="card"><div class="card-hd"><div class="card-title">Country decision</div></div>
      <div class="card-bd" style="display:flex;gap:10px;align-items:center;">
        ${pr.stage === 'under_country_review' ? `
          <button class="btn btn-success" onclick="countryDecisionAction('${pr.id}','approve')"><i class="ti ti-circle-check"></i>Approve award to ${topVendor?.name || 'top bidder'}</button>

          <button class="btn btn-ghost" onclick="countryDecisionAction('${pr.id}','reroute')"><i class="ti ti-arrow-back"></i>Return to GHBS</button>
        ` : pr.stage === 'renegotiation_in_progress'
          ? '<div style="font-size:12px;color:var(--text2);font-style:italic;">PR currently in renegotiation. Awaiting GHBS to forward updated bids.</div>'
          : `<div style="font-size:12px;color:var(--status-approved);"><i class="ti ti-circle-check"></i> Award decision recorded. PR closed.</div>`}
      </div>
    </div>
  `;
  return html;
}

// (Item 3) Country decision action placeholder — real impl would log audit + advance stage
function countryDecisionAction(prId, action) {
  if (STATE.persona !== 'carlos') return;
  const labels = { approve: 'Approve award', override: 'Override · select different vendor', reroute: 'Return to GHBS for re-evaluation' };
  const body = `
    <div class="text-sm" style="margin-bottom:12px;">${labels[action]} on <strong>${PRS[prId].title}</strong>.</div>
    ${action === 'override' ? '<label>Alternative vendor selection (free text — production version reads cleared-bid list)</label><input type="text" id="cda-vendor" placeholder="Vendor name…" /><br><br>' : ''}
    <label>Justification (mandatory, logged to audit)</label>
    <textarea id="cda-justification" placeholder="Decision rationale…"></textarea>
  `;
  const footer = `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
    <button class="btn ${action === 'approve' ? 'btn-success' : action === 'override' ? 'btn-warn' : ''}" onclick="confirmCountryDecision('${prId}','${action}')">Confirm</button>`;
  openModal(labels[action] + ' — ' + PRS[prId].title, body, footer);
}

function confirmCountryDecision(prId, action) {
  const justif = document.getElementById('cda-justification').value;
  if (!justif.trim()) { alert('Justification mandatory.'); return; }
  const pr = PRS[prId];
  const now = currentTime();
  if (action === 'approve') {
    pr.stage = 'approved_awarded';
    pr.countryDecision = { type: 'approve', by: 'Carlos Mendoza', at: now, justification: justif };
  } else if (action === 'override') {
    const altVendor = document.getElementById('cda-vendor')?.value || 'Alternative bidder';
    pr.stage = 'approved_awarded';
    pr.countryDecision = { type: 'accept_different', altVendor, by: 'Carlos Mendoza', at: now, justification: justif };
  } else if (action === 'reroute') {
    pr.stage = 'bid_under_review_resolved';
    pr.countryDecision = { type: 'reroute', by: 'Carlos Mendoza', at: now, justification: justif };
    pr.forwardedToCountryAt = null;
  }
  logAudit({ actor: 'Carlos Mendoza', role: 'Country', module: 'Tender',
    action: 'Country decision · ' + action.toUpperCase(),
    detail: `${prId} · ${pr.title}`,
    justification: justif, override: (action === 'override') });
  closeModal();
  render();
}

<script id="fortifai-inline-clean-script-v5">
(function(){
  const KILL_TEXT = [
    'board report', 'board dossier', 'board pack',
    'export (.xls)', 'export (.xlsx)', 'export cfo pack', 'export csv', 'export pdf',
    'ask kuber', 'ask sara', 'ask crystal', 'ask moneta', 'ask aegis', 'ask veritas', 'ask argus', 'ask agent',
    'live sap', 'read-only sap', 'external audit',
    '? guide', 'user guide', 'cockpit guide',
    'suppressed fp'
  ];

  function nukeClutter() {
    // 1. Hide noisy header buttons & pills unconditionally (no rect check, any child count <= 5)
    document.querySelectorAll('button, a, span, div').forEach(el => {
      if (el.tagName === 'SELECT' || el.closest('table, tbody, .drawer, .modal-card, [class*="modal"], [class*="drawer"]')) return;
      if (el.children.length > 5) return;
      // Skip wrapper divs that also contain the currency buttons or brand logo
      const raw = (el.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (!raw || raw.length > 32) return;
      if (raw.includes('usd') || raw.includes('inr') || raw.includes('fortifai')) return;

      if (KILL_TEXT.some(k => raw === k || raw.includes(k))) {
        el.style.setProperty('display', 'none', 'important');
      }
    });

    // 2. Hide numeric count pills ("14", "22") inside Tabs
    document.querySelectorAll('button, a, div, li, [role="tab"]').forEach(tab => {
      const txt = (tab.textContent || '').replace(/\s+/g, ' ').trim();
      if (tab.children.length >= 1 && tab.children.length <= 4 && txt.length > 4 && txt.length < 42) {
        if (txt.includes('Workbench') || txt.includes('Actions Hub') || txt.includes('Overview') || txt.includes('Queue') || tab.classList.contains('tab')) {
          tab.querySelectorAll('span, b, small, em').forEach(b => {
            if (/^\(?\d+\)?$/.test((b.textContent || '').trim())) {
              b.style.setProperty('display', 'none', 'important');
            }
          });
        }
      }
    });

    // 3. Hide small-font helper lines & long grey descriptions
    document.querySelectorAll('p, div, small, span').forEach(el => {
      if (el.closest('svg') || el.previousElementSibling?.tagName === 'svg') return;
      if (el.children.length === 0 && !el.closest('.drawer, .modal-card, [class*="modal"], [class*="drawer"]')) {
        const txt = (el.textContent || '').trim();
        if (!txt) return;
        const low = txt.toLowerCase();
        if (low.startsWith('click any kpi') || low.startsWith('click any bubble') || low.startsWith('click any row')) {
          el.style.setProperty('display', 'none', 'important');
          return;
        }
        const fs = parseFloat(window.getComputedStyle(el).fontSize || '13');
        if (fs <= 11.5 && txt.length > 68 && !el.closest('td.mono, th, code')) {
          el.style.setProperty('display', 'none', 'important');
        }
      }
    });
  }

  // Universal USD <-> INR converter (1 USD M = 8.35 Cr)
  const FX = 8.35;
  function convertCurrency(mode) {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const p = node.parentElement;
      if (!p || ['SCRIPT', 'STYLE', 'CODE', 'PRE'].includes(p.tagName)) return;
      const pt = (p.textContent || '').trim();
      if (['$ USD', '₹ INR', '₹ Cr', 'INR', 'USD'].includes(pt)) return;
      if (node._origCur === undefined) {
        if (/[₹$]/.test(node.nodeValue)) node._origCur = node.nodeValue;
        else return;
      }
      const orig = node._origCur;
      if (!orig) return;
      if (mode === 'USD') {
        let u = orig.replace(/₹\s?([\d,]+(?:\.\d+)?)\s*Cr\b/gi, (_, n) => {
          const cr = parseFloat(n.replace(/,/g, ''));
          if (isNaN(cr)) return _;
          const m = cr / FX;
          return m >= 1 ? '$' + m.toFixed(m >= 10 ? 1 : 2).replace(/\.00$/, '.0') + 'M' : (m === 0 ? '$0M' : '$' + Math.round(m * 1000) + 'K');
        });
        u = u.replace(/₹\s?([\d,]+(?:\.\d+)?)\s*L\b/gi, (_, n) => '$' + Math.round((parseFloat(n.replace(/,/g, '')) * 100000) / 83.5 / 1000) + 'K');
        if (node.nodeValue !== u) node.nodeValue = u;
      } else {
        if (orig.includes('₹')) {
          if (node.nodeValue !== orig) node.nodeValue = orig;
        } else {
          let u = orig.replace(/\$\s?([\d,]+(?:\.\d+)?)\s*M\b/gi, (_, n) => '₹' + (parseFloat(n.replace(/,/g, '')) * FX).toFixed(1) + ' Cr');
          if (node.nodeValue !== u) node.nodeValue = u;
        }
      }
    });
  }

  function wireCurrency() {
    document.querySelectorAll('button, span, a, div').forEach(btn => {
      if (btn.dataset.curV5 || btn.children.length > 1) return;
      const t = (btn.textContent || '').replace(/\s+/g, ' ').trim();
      if (['$ USD', 'USD', '₹ INR', 'INR', '₹ Cr'].includes(t)) {
        btn.dataset.curV5 = '1';
        btn.addEventListener('click', () => {
          const mode = t.includes('USD') ? 'USD' : 'INR';
          setTimeout(() => convertCurrency(mode), 30);
          setTimeout(() => convertCurrency(mode), 180);
        });
      }
    });
  }

  function boot() { nukeClutter(); wireCurrency(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  window.addEventListener('load', () => { boot(); setTimeout(boot, 300); setTimeout(boot, 900); });
  let tm;
  new MutationObserver(() => { clearTimeout(tm); tm = setTimeout(boot, 80); }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
