# reports/manifest.yaml
# Source of truth for HTML reports shown in Governance & Reporting.
# Required: file, title, component_key, level (a level_key from report_level_master, or a list of them).
# Optional: report_code (default: component_key), subtitle (default: title),
#           active (default: true), priority (default: last in level).
# component_key must match the case label in ReportsPageV4.tsx, if one exists.
# Retire a report with `active: false`; never delete an entry.

