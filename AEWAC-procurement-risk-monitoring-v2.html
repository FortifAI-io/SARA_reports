<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>fortifai AEWAC - Procurement Risk Monitoring</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --ff-ui:'DM Sans',-apple-system,'Segoe UI',Roboto,sans-serif;
  --ff-mono:'DM Mono',ui-monospace,Menlo,monospace;
  --nav:#0D1520; --tx:#333333; --tx-table:#374151; --tx-2:#6B7280; --tx-3:#9CA3AF;
  --border:#E5E7EB; --bg:#F2F4F7; --card:#FFFFFF;
  --brand-blue:#6699CC; --deep-blue:#2E5A8A; --steel:#99AFBC; --olive:#98AA3A;
  --sev-critical:#C62828; --sev-critical-bg:#FDECEC; --sev-critical-tx:#8B1A1A;
  --sev-high:#E65100; --sev-high-bg:#FFF3E0; --sev-high-tx:#6D3B00;
  --sev-medium:#98AA3A; --sev-medium-bg:#F5F7DC; --sev-medium-tx:#3A4400;
  --sev-low:#6699CC; --sev-low-bg:#E8F0F8; --sev-low-tx:#1A3A5C;
  --sev-norisk:#6B7280; --sev-norisk-bg:#F2F4F7; --sev-norisk-tx:#374151;
  --ramp-1:#EDEFF3; --ramp-2:#AEB6C2; --ramp-3:#6B7686; --ramp-4:#3F4A5A;
  --r:6px; --r-lg:8px; --sh:0 1px 3px rgba(13,21,32,.06); --sh-md:0 4px 12px rgba(13,21,32,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ff-ui);background:var(--bg);color:var(--tx);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--ff-mono)}
a,.link{color:var(--deep-blue);text-decoration:none;cursor:pointer}
a:hover,.link:hover{text-decoration:underline}
button{font-family:var(--ff-ui);cursor:pointer}

.topbar{background:var(--nav);color:#fff;display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;position:sticky;top:0;z-index:40}
.wordmark{font-weight:600;font-size:15px;letter-spacing:.3px}
.wm-product{font-family:'Playfair Display',serif;font-style:italic;color:#8Fb4de;font-size:20px;margin-left:3px}
.wm-sub{font-family:var(--ff-mono);font-size:12px;color:#aab3c0;margin-left:10px}
.topbar .spacer{flex:1}
.demo-badge{border:1px solid #E6A23C;color:#E6A23C;font-family:var(--ff-mono);font-size:11px;font-weight:500;letter-spacing:.5px;padding:4px 9px;border-radius:4px;cursor:default}
.icon-btn{width:34px;height:34px;border-radius:7px;border:1px solid #2a3647;background:#141e2c;color:#cbd3dd;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
.icon-btn:hover{border-color:var(--brand-blue);color:#fff}
.chip{background:#141e2c;border:1px solid #2a3647;color:#dde3ea;border-radius:7px;padding:7px 11px;font-size:12px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.chip:hover{border-color:var(--brand-blue)}
.chip .car{color:#aab3c0;font-size:10px}
.user-chip{background:#141e2c;border:1px solid #2a3647;color:#eef1f5;border-radius:7px;padding:5px 11px;display:inline-flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;position:relative}
.user-chip .av{width:22px;height:22px;border-radius:50%;background:var(--brand-blue);display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:600}
.umenu{position:absolute;top:42px;right:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-md);min-width:180px;display:none;z-index:50;overflow:hidden}
.umenu.on{display:block}
.umenu div{padding:9px 13px;font-size:13px;color:var(--tx-table)}
.umenu div:hover{background:var(--bg)}
.umenu .cur{color:var(--deep-blue);font-weight:600}

.tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;gap:4px;padding:0 20px;position:sticky;top:56px;z-index:30;flex-wrap:wrap}
.tab{padding:14px 15px;font-size:13px;font-weight:400;color:var(--tx-3);border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:8px;background:none;border-left:none;border-right:none;border-top:none}
.tab:hover{color:var(--tx-2)}
.tab.active{color:var(--deep-blue);font-weight:600;border-bottom-color:var(--deep-blue)}
.tab .cnt{background:var(--bg);color:var(--tx-2);border-radius:10px;font-size:11px;font-weight:600;padding:1px 8px;min-width:20px;text-align:center}
.tab.active .cnt{background:var(--sev-low-bg);color:var(--deep-blue)}

.wrap{max-width:1560px;margin:0 auto;padding:22px 20px 70px}
.page-title{font-size:21px;font-weight:600;margin:4px 0 6px}
.page-sub{color:var(--tx-2);font-size:13px;max-width:820px;margin-bottom:18px;line-height:1.6}
.sec-cap{font-size:11px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.5px;margin:20px 0 10px}

.sev{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;line-height:1.6}
.sev-critical{background:var(--sev-critical-bg);color:var(--sev-critical-tx)}
.sev-high{background:var(--sev-high-bg);color:var(--sev-high-tx)}
.sev-medium{background:var(--sev-medium-bg);color:var(--sev-medium-tx)}
.sev-low{background:var(--sev-low-bg);color:var(--sev-low-tx)}
.sev-norisk{background:var(--sev-norisk-bg);color:var(--sev-norisk-tx)}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;background:var(--bg);color:var(--tx-2);border:1px solid var(--border)}
.tag-code{background:#FDECEC;color:#8B1A1A;border-color:#f3d0d0}
.tag-planted{background:#FFF8E1;color:#7a5f12;border-color:#ecdca6}
.tag-indic{background:#EEF1F5;color:#44506a;border:1px solid #d4dbe6}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:13px 15px}
.kpi .lab{font-size:11px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}
.kpi .val{font-size:23px;font-weight:600;font-family:var(--ff-mono);color:var(--tx)}
.kpi .val.hi{color:var(--sev-high)} .kpi .val.cr{color:var(--sev-critical)} .kpi .val.ok{color:var(--sev-medium)}
.kpi .sub{font-size:11px;color:var(--tx-2);margin-top:3px}
.kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--steel)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px}
.panel h3{font-size:13px;font-weight:600;margin:0 0 4px;color:var(--tx)}
.panel .ph-sub{font-size:11px;color:var(--tx-2);margin-bottom:12px}

.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:130px 1fr 72px;gap:10px;align-items:center;font-size:12px}
.barrow .bl{color:var(--tx-table);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bartrack{height:16px;background:var(--bg);border-radius:3px;overflow:hidden}
.barfill{height:100%;border-radius:3px}
.barrow .bv{font-family:var(--ff-mono);font-size:11px;color:var(--tx-2);text-align:right}

.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.tbl th{text-align:left;font-size:11px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:2px solid var(--border)}
.tbl td{padding:9px 12px;color:var(--tx-table);border-bottom:1px solid var(--border)}
.tbl tbody tr:nth-child(even){background:var(--bg)}
.tbl tbody tr:hover{background:#eef3f8}
.tbl.clean tbody tr{cursor:pointer}

/* confusion / detection */
.cm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 12px}
.cmcell{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;text-align:center}
.cmcell .n{font-family:var(--ff-mono);font-size:22px;font-weight:600}
.cmcell .l{font-size:11px;color:var(--tx-2);margin-top:3px}
.cmcell.tp{background:#F5F7DC} .cmcell.fp{background:#FFF3E0} .cmcell.fn{background:#FDECEC}
.pr-row{display:flex;gap:18px;align-items:center;margin-top:4px}
.pr-metric{text-align:center}
.pr-metric .v{font-family:var(--ff-mono);font-size:26px;font-weight:600;color:var(--deep-blue)}
.pr-metric .k{font-size:11px;color:var(--tx-2)}

/* workbench */
.wb{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
.wb-controls{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.selct,.srch{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;font-size:13px;color:var(--tx-table);font-family:var(--ff-ui)}
.srch{flex:1;min-width:150px}
.kbd-row{font-family:var(--ff-mono);font-size:11px;color:var(--tx-2);margin:2px 0 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.kbd{background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:0 5px;color:var(--tx-2);font-weight:500}
.caselist{display:flex;flex-direction:column;gap:10px;max-height:1300px;overflow:auto;padding-right:2px}
.caserow{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;cursor:pointer;border-left:3px solid transparent}
.caserow:hover{border-color:var(--steel)}
.caserow.sel{border-color:var(--deep-blue);border-left-color:var(--deep-blue);box-shadow:var(--sh)}
.caserow .r1{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;display:inline-block;margin-right:7px}
.dot.critical{background:var(--sev-critical)} .dot.high{background:var(--sev-high)} .dot.medium{background:var(--sev-medium)} .dot.low{background:var(--sev-low)}
.vend-pill{font-size:12px;font-weight:500;color:var(--deep-blue);background:var(--sev-low-bg);border-radius:4px;padding:2px 8px}
.amt{font-family:var(--ff-mono);font-size:13px;font-weight:500;color:var(--tx)}
.caserow .title{font-size:13px;font-weight:600;color:var(--tx);margin:3px 0}
.caserow .meta{font-family:var(--ff-mono);font-size:11px;color:var(--tx-2)}
.caserow .r3{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.pin{font-family:var(--ff-mono);font-size:10px;font-weight:600;background:#eef1f5;color:#44506a;border-radius:3px;padding:1px 6px}
.pin.warn{background:var(--sev-high-bg);color:var(--sev-high-tx)}

.pane{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;position:sticky;top:116px}
.pane-h{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}
.ring{position:relative;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--ff-mono);font-weight:600}
.pane-title{font-size:17px;font-weight:600;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pane-sub{font-family:var(--ff-mono);font-size:12px;color:var(--tx-2);margin-top:4px}
.pane-right{margin-left:auto;text-align:right}
.pane-amt{font-family:var(--ff-mono);font-size:18px;font-weight:600}
.pane-age{font-family:var(--ff-mono);font-size:12px;color:var(--tx-3);margin-top:4px}
.btn-invest{background:var(--nav);color:#fff;border:none;border-radius:var(--r);padding:9px 15px;font-size:13px;font-weight:500;margin-top:8px}
.btn-invest:hover{background:#1a2636}
.assign-line{font-size:12px;color:var(--tx-2);margin:12px 0 2px}
.queue-line{font-family:var(--ff-mono);font-size:11px;color:var(--tx-3);margin-bottom:14px}
.scorebox{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin:14px 0}
.scorebox .lab{font-size:11px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px;display:inline}
.scorebox .eq{font-family:var(--ff-mono);font-size:14px;font-weight:600;margin-left:10px}
.scorebox .note{font-size:11px;color:var(--tx-2);margin-top:6px}
.lifecycle{display:flex;align-items:center;gap:6px;margin:16px 0;flex-wrap:wrap}
.lc{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx-3)}
.lc .o{width:14px;height:14px;border-radius:50%;border:2px solid var(--tx-3);display:inline-block}
.lc.done{color:var(--tx-2)} .lc.done .o{background:var(--deep-blue);border-color:var(--deep-blue)}
.lc.cur{color:var(--deep-blue);font-weight:600} .lc.cur .o{border-color:var(--deep-blue);box-shadow:inset 0 0 0 3px #fff,0 0 0 2px var(--deep-blue)}
.lc-sep{color:var(--border)}
.means{font-size:13px;color:var(--tx-table);line-height:1.6}
.xa{background:#eef3f8;border:1px solid #d6e2ef;border-radius:var(--r);overflow:hidden;margin-top:6px}
.xa-h{background:var(--deep-blue);color:#fff;padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.xa-h .tagr{margin-left:auto;font-family:var(--ff-mono);font-size:10px;font-weight:400;background:rgba(255,255,255,.16);padding:2px 8px;border-radius:3px}
.xa-b{padding:12px 14px;font-size:13px;color:var(--tx-table)}
.xa-ask{margin-top:10px;display:flex;gap:7px}
.xa-ask input{flex:1;border:1px solid #cdd9e8;border-radius:var(--r);padding:7px 10px;font-size:12px;font-family:var(--ff-ui);background:#fff;color:#333;color-scheme:light}
.xa-ask button{background:var(--deep-blue);color:#fff;border:none;border-radius:var(--r);padding:7px 12px;font-size:12px}
.triband{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
.tri{border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;background:var(--bg)}
.tri .tk{font-size:10px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px}
.tri .tv{font-family:var(--ff-mono);font-size:12px;color:var(--tx-table);margin-top:4px}
.proc{margin:0;padding-left:18px;font-size:13px;color:var(--tx-table)}
.proc li{margin:5px 0}
.chain{display:flex;flex-direction:column;margin-top:6px}
.cnode{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.cnode .step{font-size:12px;font-weight:600;color:var(--tx)}
.cnode .f{display:flex;gap:16px;flex-wrap:wrap;font-size:12px}
.cnode .f .k{color:var(--tx-3);font-family:var(--ff-mono);font-size:10px;display:block}
.cnode .f .v{font-family:var(--ff-mono);font-size:12px;color:var(--tx-table)}
.cnode.broke{background:#fff6f4}
.cnode.broke .step{color:var(--sev-high)}
.break-flag{font-size:10px;font-weight:600;color:var(--sev-high-tx);background:var(--sev-high-bg);border-radius:3px;padding:1px 7px;margin-left:8px}
.dispo-btns{display:flex;gap:10px;margin:16px 0}
.btn{font-size:13px;font-weight:500;border-radius:var(--r);padding:8px 14px;border:1px solid var(--border);background:var(--card);color:var(--tx-2)}
.btn:hover{border-color:var(--deep-blue);color:var(--deep-blue)}
.btn-esc{border-color:#f0c9a0;color:var(--sev-high-tx);background:var(--sev-high-bg)}
.btn-clr{border-color:#bcd0a0;color:var(--sev-medium-tx);background:var(--sev-medium-bg)}
.btn-primary{background:var(--nav);color:#fff;border-color:var(--nav)}
.btn-primary:hover{background:#1a2636}

/* pattern cards */
.pat-intro{background:#eef1f5;border:1px solid #d4dbe6;border-radius:var(--r);padding:12px 15px;font-size:13px;color:#44506a;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start;line-height:1.6}
.patgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.patcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.patcard.net{grid-column:1/-1}
.patcard-h{display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg)}
.patcard-h .pc{font-family:var(--ff-mono);font-size:11px;font-weight:500;color:var(--deep-blue)}
.patcard-h .pt{font-size:13px;font-weight:600}
.patcard-h .lvl{margin-left:auto;font-size:10px;font-weight:600;color:var(--tx-2);background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:1px 7px}
.patcard-b{padding:13px 14px}
.patcard-b .subj{font-size:13px;font-weight:600;margin-bottom:3px}
.patcard-b .metric{font-size:12px;color:var(--tx-table);margin:7px 0;line-height:1.55}
.patcard-b .base{font-family:var(--ff-mono);font-size:11px;color:var(--tx-2)}
.conf-row{display:flex;align-items:center;gap:8px;margin:9px 0}
.conf-bar{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden}
.conf-fill{height:100%;background:var(--steel)}
.conf-num{font-family:var(--ff-mono);font-size:11px;color:var(--tx-2)}
.facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fact{font-size:10px;color:var(--tx-2);background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:1px 7px}
.dep{font-size:11px;color:#7a5f12;background:#FFF8E1;border:1px solid #ecdca6;border-radius:4px;padding:6px 9px;margin-top:9px}
.gate{font-size:10px;font-weight:600;color:#7a5f12;background:#FFF8E1;border:1px solid #ecdca6;border-radius:3px;padding:1px 7px}
.patbtns{display:flex;gap:8px;margin-top:11px}
.nlbl{font-family:var(--ff-mono);font-size:9px;fill:var(--tx-2)}
.net-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:11px;color:var(--tx-2)}
.net-legend span{display:inline-flex;align-items:center;gap:5px}
.lg-dot{width:9px;height:9px;border-radius:50%;display:inline-block}

/* modal */
.ov{position:fixed;inset:0;background:rgba(13,21,32,.45);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:28px;overflow:auto}
.ov.on{display:flex}
.modal{background:var(--card);border-radius:var(--r-lg);max-width:980px;width:100%;box-shadow:0 20px 60px rgba(13,21,32,.3);margin:auto}
.modal.wide{max-width:1080px}
.modal.narrow{max-width:520px}
.modal-h{display:flex;align-items:center;gap:12px;padding:17px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:2;border-radius:var(--r-lg) var(--r-lg) 0 0}
.modal-h .x{margin-left:auto;font-size:20px;color:var(--tx-3);background:none;border:none}
.modal-b{padding:22px}
.ta{width:100%;min-height:72px;border:1px solid var(--border);border-radius:var(--r);padding:10px;font-family:var(--ff-ui);font-size:13px;color:#333;background:#fff;color-scheme:light}
.sod-note{font-size:11px;color:var(--tx-2);background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:8px 11px;margin-top:10px}
.sod-note.warn{background:var(--sev-high-bg);border-color:#f0c9a0;color:var(--sev-high-tx)}
.rev-field{margin:12px 0}
.rev-field label{font-size:11px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:5px}
.rev-field select{width:100%;border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:var(--ff-ui);background:#fff;color:#333;color-scheme:light}

/* assistant drawer */
.drawer{position:fixed;top:0;right:0;height:100%;width:430px;background:var(--card);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(13,21,32,.12);transform:translateX(100%);transition:transform .2s;z-index:55;display:flex;flex-direction:column}
.drawer.on{transform:translateX(0)}
.drawer-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.drawer-h .wm{font-family:'Playfair Display',serif;font-style:italic;color:var(--deep-blue);font-size:17px}
.gov-tag{margin-left:auto;font-family:var(--ff-mono);font-size:10px;color:var(--tx-3);background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:2px 7px}
.drawer-b{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ask-ex{font-size:12px;color:var(--deep-blue);background:var(--sev-low-bg);border:1px solid #d6e2ef;border-radius:var(--r);padding:8px 11px;cursor:pointer}
.ask-ex:hover{background:#dbe8f5}
.msg{font-size:13px;line-height:1.6;padding:10px 12px;border-radius:var(--r)}
.msg.u{background:var(--bg);align-self:flex-end;max-width:85%}
.msg.a{background:#eef3f8;border:1px solid #d6e2ef}
.msg .sqlq{font-family:var(--ff-mono);font-size:11px;color:var(--tx-2);background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:5px 8px;margin-top:7px;display:block}
.drawer-f{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px}
.drawer-f input{flex:1;border:1px solid var(--border);border-radius:var(--r);padding:9px 11px;font-size:13px;font-family:var(--ff-ui);background:#fff;color:#333;color-scheme:light}
.drawer-f button{background:var(--nav);color:#fff;border:none;border-radius:var(--r);padding:9px 14px;font-size:13px}

/* admin deployment tiers */
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px}
.tier{border:1px solid var(--border);border-radius:var(--r-lg);padding:16px 18px;cursor:pointer;background:var(--card)}
.tier.sel{border-color:var(--deep-blue);background:#f6f9fc;box-shadow:inset 0 0 0 1px var(--deep-blue)}
.tier-h{display:flex;align-items:center;gap:10px}
.tier-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--tx-3);flex:0 0 auto}
.tier.sel .tier-radio{border-color:var(--deep-blue);box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--deep-blue)}
.tier-h .tn{font-size:14px;font-weight:600}
.tier-h .active-pill{margin-left:auto;background:var(--nav);color:#fff;font-size:10px;font-weight:600;border-radius:3px;padding:2px 8px;letter-spacing:.3px}
.tier .prov{font-family:var(--ff-mono);font-size:12px;color:var(--tx-2);margin:8px 0}
.tier .desc{font-size:12px;color:var(--tx-table);line-height:1.55}
.tier .tradeoff{font-size:12px;color:var(--tx-2);border-top:1px dashed var(--border);margin-top:10px;padding-top:9px}
.tier .bestfit{font-size:12px;font-style:italic;color:var(--tx-2);margin-top:7px}

.tag-rec{background:#eef6ee;color:#2f5a2f;border-color:#cfe3cf}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px}
.subtab{padding:10px 14px;font-size:13px;font-weight:400;color:var(--tx-3);border:none;background:none;border-bottom:2px solid transparent}
.subtab:hover{color:var(--tx-2)}
.subtab.on{color:var(--deep-blue);font-weight:600;border-bottom-color:var(--deep-blue)}
.subtab b{font-weight:600}
.dkpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.dkpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:15px 18px}
.dkpi .lab{font-size:11px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.dkpi .val{font-size:30px;font-weight:600;font-family:var(--ff-mono);color:var(--tx)}
.dkpi .sub{font-size:11px;color:var(--tx-2);margin-top:3px}
.disp-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.disp-bar .lab{font-size:11px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px}
.rep-bar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px;flex-wrap:wrap}
.rep-bar .lab{font-size:11px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px}
.rep-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:14px}
.rep-card.primary{border-color:var(--steel);box-shadow:inset 0 0 0 1px var(--steel)}
.rep-card h4{font-size:15px;font-weight:600;margin:0 0 8px}
.rep-card p{font-size:13px;color:var(--tx-2);line-height:1.6;margin:0 0 14px;max-width:900px}
.rc-btns{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--nav);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:13px;box-shadow:var(--sh-md);z-index:70;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.hidden{display:none!important}
.foot{margin-top:26px;font-size:11px;color:var(--tx-3);border-top:1px solid var(--border);padding-top:14px;line-height:1.6}
@media(max-width:1200px){.wb{grid-template-columns:1fr}.pane{position:static}.kpis{grid-template-columns:repeat(3,1fr)}.grid2,.grid3,.patgrid,.tiers{grid-template-columns:1fr}}
</style>
</head>

/* ---------- helpers ---------- */
function esc(s){return (s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function ring(score,sev,size){size=size||60;const r=(size-8)/2,c=2*Math.PI*r,off=c*(1-score/100),col=SEVCOL[sev];
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}">
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border)" stroke-width="5"/>
   <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>
   <span class="num" style="color:${col};font-size:${size>50?17:13}px">${score}</span></div>`;}
function sevTag(s){return `<span class="sev sev-${s}">${SEVLABEL[s]}</span>`;}
function caseById(id){return DATA.cases.find(c=>c.id===id);}
function wbFiltered(){return DATA.cases.filter(c=>(SEVFILTER==='all'||c.severity===SEVFILTER)&&(FAMFILTER==='all'||c.indicator===FAMFILTER)&&(!Q||(c.vendor+c.id+c.indicator_short).toLowerCase().includes(Q.toLowerCase())));}

/* ---------- SVG charts (zero-egress, inline) ---------- */
function svgLine(series,{w=520,h=150,pad=30}={}){
  const vals=series.map(s=>s.exposure),max=Math.max(1,...vals);
  const n=series.length,iw=w-pad*2,ih=h-pad*1.4;
  const x=i=>pad+(n<=1?iw/2:iw*i/(n-1)), y=v=>pad*0.5+ih*(1-v/max);
  const pts=series.map((s,i)=>[x(i),y(s.exposure)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=path+` L ${x(n-1)} ${pad*0.5+ih} L ${x(0)} ${pad*0.5+ih} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--deep-blue)"><title>${series[i].month}: ${series[i].exposure_disp} (${series[i].cases} cases)</title></circle>`).join('');
  const xl=series.map((s,i)=>`<text x="${x(i)}" y="${h-6}" text-anchor="middle" font-family="DM Mono" font-size="9" fill="var(--tx-3)">${s.month.slice(5)}</text>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">
    <path d="${area}" fill="#e8f0f8" opacity="0.7"/><path d="${path}" fill="none" stroke="var(--deep-blue)" stroke-width="2"/>${dots}${xl}</svg>`;
}
function bars(rows,colorFn){const max=Math.max(1,...rows.map(r=>r.exposure));
  return `<div class="bars">${rows.map(r=>`<div class="barrow"><span class="bl" title="${esc(r.name)}">${esc(r.name)}</span>
    <div class="bartrack"><div class="barfill" style="width:${Math.max(3,100*r.exposure/max)}%;background:${colorFn?colorFn(r):'var(--steel)'}"></div></div>
    <span class="bv">${r.exposure_disp}</span></div>`).join('')}</div>`;}
function sevBars(dist){const total=Object.values(dist).reduce((a,b)=>a+b,0)||1;
  return `<div class="bars">${['critical','high','medium','low'].map(s=>`<div class="barrow"><span class="bl">${sevTag(s)}</span>
    <div class="bartrack"><div class="barfill" style="width:${Math.max(3,100*dist[s]/total)}%;background:${SEVCOL[s]}"></div></div>
    <span class="bv">${dist[s]}</span></div>`).join('')}</div>`;}

  const list=wbFiltered();
  if(!list.find(c=>c.id===SEL))SEL=list[0]&&list[0].id;
  const famOpts=['<option value="all">All indicators</option>'].concat(DATA.register.map(r=>`<option value="${r.code}" ${FAMFILTER===r.code?'selected':''}>${r.short}</option>`)).join('');
  document.getElementById('view-workbench').innerHTML=`
   <div class="page-title">Workbench</div>
   <div class="page-sub">Open scheme-matched cases at vendor x indicator grain. Multiple indicators on one record roll up into one case. Select a case for its 360 in the pane; Investigate opens the full record.</div>
   <div class="wb-controls">
     <select class="selct" onchange="SEVFILTER=this.value;render()"><option value="all">All severities</option>${['critical','high','medium','low'].map(s=>`<option value="${s}" ${SEVFILTER===s?'selected':''}>${SEVLABEL[s]}</option>`).join('')}</select>
     <select class="selct" onchange="FAMFILTER=this.value;render()">${famOpts}</select>
     <input class="srch" placeholder="Search vendor, case, indicator..." value="${esc(Q)}" oninput="Q=this.value;render()">
     <span style="margin-left:auto;align-self:center;font-family:var(--ff-mono);font-size:12px;color:var(--tx-3)">${list.length} cases</span>
   </div>
   <div class="kbd-row"><span class="kbd">j</span>/<span class="kbd">k</span> move &middot; <span class="kbd">e</span> escalate &middot; <span class="kbd">f</span> false positive &middot; <span class="kbd">c</span> clear &middot; <span class="kbd">o</span> full investigation &middot; <span class="kbd">/</span> search</div>
   <div class="wb"><div class="caselist">${list.map((c,i)=>caseRow(c,i)).join('')||'<div class="page-sub">No cases match.</div>'}</div>
     <div>${SEL?pane(caseById(SEL)):'<div class="pane">Select a case.</div>'}</div></div>`;
}
function caseRow(c,i){const br=c.age_days>c.sla_days;
  return `<div class="caserow ${c.id===SEL?'sel':''}" onclick="SEL='${c.id}';render()">
   <div class="r1"><span><span class="dot ${c.severity}"></span><span class="vend-pill">${esc(c.vendor)}</span></span><span class="amt">${c.exposure_disp}</span></div>
   <div class="title">${c.indicator_short} <span class="tag tag-code">${c.indicator}</span>${c.recovery_candidate?' <span class="tag tag-rec">&#9679; Recovery candidate</span>':''}</div>
   <div class="meta">${c.id} &middot; ${c.vendor_id} &middot; ${c.company_code} &middot; ${esc(c.plant)}</div>
   <div class="r3"><span class="pin ${br?'warn':''}">Age ${c.age_days}d</span><span class="pin">SLA ${c.sla_days}d</span><span class="pin">score ${c.score}</span><span class="pin">${c.txns} txns</span><span class="pin">${c.status}</span></div></div>`;
}
function pane(c){
  if(!c)return '<div class="pane">Select a case.</div>';
  const parts=c.score_parts.map(p=>`${p.code} ${p.pts}`).join(' + ');
  return `<div class="pane">
   <div class="pane-h">${ring(c.score,c.severity)}
     <div><div class="pane-title">${sevTag(c.severity)} ${c.indicator_short} <span class="tag tag-code">${c.indicator}</span>${c.recovery_candidate?' <span class="tag tag-rec">&#9679; Recovery candidate</span>':''}</div>
       <div class="pane-sub">${esc(c.vendor)} &middot; ${c.vendor_id} &middot; ${c.company_code} &middot; ${esc(c.plant)}</div></div>
     <div class="pane-right"><div class="pane-amt">${c.exposure_disp}</div><div class="pane-age">Age ${c.age_days}d &middot; SLA ${c.sla_days}d</div>
       <button class="btn-invest" onclick="openInvestigation('${c.id}')">Investigate (full screen)</button></div></div>
   <div class="assign-line">Auto-assigned &middot; ${esc(c.assignee)} &middot; SLA ${c.sla_days}d &middot; status: <b>${c.status}</b></div>
   <div class="queue-line">Procurement monitoring queue &middot; ${esc(c.category)}</div>
   <div class="scorebox"><span class="lab">Composite score</span><span class="eq">${parts} = ${c.score}</span>
     <div class="note">severity from composite: Critical &ge;60 &middot; High &ge;40 &middot; Medium &ge;20 &middot; Low &lt;20 &middot; drivers: severity weight, exposure band, repeat frequency, detection confidence</div></div>
   ${lifecycle(c.status)}
   <div class="sec-cap">What this means</div><div class="means">${c.what}</div>
   <div class="sec-cap">Why this was flagged (Xa)</div>
   <div class="xa"><div class="xa-h">Xa &middot; risk explanation <span class="tagr">reproduces governed SAP P2P evidence &middot; no fresh analysis</span></div>
     <div class="xa-b">${c.xa}
       <div class="xa-ask"><input id="xaq-${c.id}" placeholder="Ask about this case..." onkeydown="if(event.key==='Enter')xaAsk('${c.id}')"><button onclick="xaAsk('${c.id}')">Ask</button></div>
       <div id="xaa-${c.id}"></div></div></div>
   ${c.recovery_candidate?`<div class="sec-cap">Recovery assessment (AI)</div>
   <div class="xa" style="background:#f3f8f3;border-color:#cfe3cf"><div class="xa-h" style="background:var(--sev-medium)">Recovery candidate <span class="tagr">AI-applied at detection &middot; carried to disposition</span></div>
     <div class="xa-b">AEWAC assessed this case as recoverable: <b>${c.recoverable_disp}</b>. Basis: ${esc(c.recovery_basis)}. This is a flagged estimate for recovery workflow, not confirmed loss; a reviewer confirms before any claim.</div></div>`:(c.avoidable_disp?`<div class="sec-cap">Spend assessment (AI)</div>
   <div class="means" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px 12px">Not a clawback: this is <b>avoidable spend</b> of ${c.avoidable_disp} (${esc(c.recovery_basis)}), shown as a benchmark saving rather than recovery.</div>`:'')}
   <div class="sec-cap">Triangulated evidence (governed feeds)</div>
   <div class="triband">${c.feeds.map(f=>`<div class="tri"><div class="tk">feed</div><div class="tv">${esc(f)}</div></div>`).join('')}</div>
   <div class="sec-cap">Document chain (PR &rarr; PO &rarr; GR &rarr; Invoice &rarr; Payment)</div>${chainHtml(c)}
   <div class="sec-cap">Suggested procedures (AI)</div><ol class="proc">${c.procedures.map(p=>`<li>${esc(p)}</li>`).join('')}</ol>
   <div class="dispo-btns"><button class="btn btn-esc" onclick="openDispo('${c.id}','Escalate')">Escalate</button>
     <button class="btn" onclick="openDispo('${c.id}','False positive')">False positive</button>
     <button class="btn btn-clr" onclick="openDispo('${c.id}','Clear')">Clear</button></div></div>`;
}
function lifecycle(st){const steps=['Detected','Assigned','Under review','Escalated','Resolved'];
  let idx=steps.indexOf(st==='Confirmed risk'?'Resolved':st); if(idx<0)idx=0;
  return `<div class="lifecycle">${steps.map((s,i)=>{const cls=i<idx?'done':i===idx?'cur':'';return `<span class="lc ${cls}"><span class="o"></span>${s}</span>${i<steps.length-1?'<span class="lc-sep">&mdash;</span>':''}`;}).join('')}</div>`;}
function chainHtml(c){return `<div class="chain">${c.chain.map(n=>{const broke=n.step===c.break_step;const f=[];
  if(n.no&&n.no!=='-')f.push(`<span><span class="k">doc</span><span class="v">${n.no}</span></span>`);
  if(n.date)f.push(`<span><span class="k">date</span><span class="v">${n.date}</span></span>`);
  if(n.qty!==''&&n.qty!=null)f.push(`<span><span class="k">qty</span><span class="v">${n.qty}</span></span>`);
  if(n.unit_price)f.push(`<span><span class="k">unit px</span><span class="v">${n.unit_price}</span></span>`);
  if(n.value&&n.value!=='-')f.push(`<span><span class="k">value</span><span class="v">${n.value}</span></span>`);
  if(n.po_ref!==undefined)f.push(`<span><span class="k">po ref</span><span class="v">${n.po_ref||'(none)'}</span></span>`);
  f.push(`<span><span class="k">sap user</span><span class="v">${esc(n.user)}</span></span>`);
  f.push(`<span><span class="k">status</span><span class="v">${esc(n.status)}</span></span>`);
  return `<div class="cnode ${broke?'broke':''}"><div><div class="step">${n.step}${broke?'<span class="break-flag">chain break</span>':''}</div></div><div class="f">${f.join('')}</div></div>`;}).join('')}</div>`;}

function xaAsk(id){const c=caseById(id);const el=document.getElementById('xaq-'+id);const q=el.value.trim();if(!q)return;el.value='';
  document.getElementById('xaa-'+id).innerHTML=`<div style="margin-top:9px;font-size:12px;color:var(--tx-table);background:#fff;border:1px solid #d6e2ef;border-radius:6px;padding:9px 11px"><span class="mono" style="font-size:10px;color:var(--tx-3)">governed answer</span><br>${esc(caseAnswer(c,q))}</div>`;}
function caseAnswer(c,q){q=q.toLowerCase();
  if(/user|who|buyer|poster|passed|posted/.test(q)){const u=[...new Set(c.docs.flatMap(d=>[d.buyer,d.inv_user,d.pay_user]))].filter(Boolean);return `On this case the SAP users on the flagged documents are: ${u.join(', ')}. AEWAC states which user performed each system action; it does not characterise any person.`;}
  if(/why|flag|reason/.test(q))return c.xa+' This is an indicator for review, not a conclusion.';
  if(/material|item|price|amount|value/.test(q))return `${c.xa} Aggregate exposure on this case is ${c.exposure_disp} across ${c.txns} document(s).`;
  if(/duplicate|same/.test(q))return c.xa;
  return `This case is ${c.indicator_short} (${c.indicator}) on vendor ${c.vendor}, severity ${SEVLABEL[c.severity]}, exposure ${c.exposure_disp}. Ask about the SAP users, the documents, or why it was flagged. I answer from the case evidence only.`;}

/* ---------- PATTERN ANALYSIS ---------- */
function renderPattern(){
  document.getElementById('view-pattern').innerHTML=`
   <div class="page-title">Pattern analysis <span class="tag tag-indic" style="font-size:11px;vertical-align:middle">Tier-2 indicative</span></div>
   <div class="page-sub">Behavioural, concentration and network leads learned on each subject's own history using robust statistics, not fixed thresholds. Deduped against rule hits, confidence-gated, corroborate before any conclusion. Promote a lead to open it as a workbench case.</div>
   <div class="pat-intro"><span>&#9432;</span><span>Tier-2 is the strict complement of the deterministic rules. A record that already tripped a rule does not reappear here. Each lead carries aggregate evidence and a learned baseline; a thin baseline is gated and labelled. The network lead is shown as a relationship graph.</span></div>
   <div class="patgrid">${DATA.tier2.map(patCard).join('')}</div>`;
}
function patCard(p){
  if(p.kind==='network')return netCard(p);
  return `<div class="patcard">
   <div class="patcard-h"><span class="pc">${p.code}</span><span class="pt">${esc(p.title)}</span><span class="lvl">${p.level}</span></div>
   <div class="patcard-b"><div class="subj">${esc(p.subject)}${p.subject_id&&p.subject_id!==p.subject?` <span class="mono" style="font-size:11px;color:var(--tx-3)">${p.subject_id}</span>`:''}</div>
     <div class="base">${esc(p.baseline)} ${p.baseline_sufficient?'':'<span class="gate">baseline thin</span>'}</div>
     <div class="metric">${esc(p.metric)}</div>
     <div class="conf-row"><span class="mono" style="font-size:10px;color:var(--tx-3)">CONF</span><div class="conf-bar"><div class="conf-fill" style="width:${p.confidence}%"></div></div><span class="conf-num">${p.confidence}</span></div>
     <div style="font-family:var(--ff-mono);font-size:11px;color:var(--tx-2)">exposure ${p.exposure_disp} &middot; ${p.txns} records${p.doc?` &middot; ${p.doc}`:''}</div>
     <div class="facts">${p.factors.map(f=>`<span class="fact">${esc(f)}</span>`).join('')}</div>
     ${p.data_dependency?`<div class="dep"><b>Data dependency:</b> ${esc(p.data_dependency)}</div>`:''}
     <div class="patbtns"><button class="btn" onclick="patInvestigate('${p.code}')">Investigate lead</button><button class="btn btn-primary" onclick="promoteLead('${p.code}')">Promote to workbench</button></div>
   </div></div>`;
}
function netCard(p){
  return `<div class="patcard net">
   <div class="patcard-h"><span class="pc">${p.code}</span><span class="pt">${esc(p.title)}</span><span class="lvl">${p.level}</span></div>
   <div class="patcard-b"><div class="grid2" style="gap:18px;align-items:start">
     <div><div class="subj">${esc(p.subject)} <span class="mono" style="font-size:11px;color:var(--tx-3)">${p.subject_id}</span></div>
       <div class="base">${esc(p.baseline)}</div><div class="metric">${esc(p.metric)}</div>
       <div class="conf-row"><span class="mono" style="font-size:10px;color:var(--tx-3)">CONF</span><div class="conf-bar"><div class="conf-fill" style="width:${p.confidence}%"></div></div><span class="conf-num">${p.confidence}</span></div>
       <div style="font-family:var(--ff-mono);font-size:11px;color:var(--tx-2)">exposure ${p.exposure_disp} &middot; ${p.txns} linked vendors</div>
       <div class="facts">${p.factors.map(f=>`<span class="fact">${esc(f)}</span>`).join('')}</div>
       ${p.data_dependency?`<div class="dep"><b>Data dependency:</b> ${esc(p.data_dependency)}</div>`:''}
       <div class="patbtns"><button class="btn" onclick="patInvestigate('${p.code}')">Investigate network</button><button class="btn btn-primary" onclick="promoteLead('${p.code}')">Promote to workbench</button></div></div>
     <div><div class="tk" style="font-size:10px;font-weight:600;color:var(--tx-2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px">Relationship graph</div>
       ${netGraph(p.network)}
       <div class="net-legend"><span><span class="lg-dot" style="background:#C62828"></span> vendor with case</span><span><span class="lg-dot" style="background:#2E5A8A"></span> employee</span><span>lines = shared identifier</span></div></div>
   </div></div></div>`;
}
function benfordChart(b){const digits=['1','2','3','4','5','6','7','8','9'];
  const obs=b.observed||{},exp=b.expected||{};const maxv=Math.max(1,...digits.map(d=>Math.max(obs[d]||0,exp[d]||0)));
  const W=460,H=170,pad=28,iw=W-pad*2,ih=H-pad*1.6,bw=iw/digits.length;
  const bars=digits.map((d,i)=>{const x=pad+i*bw,oh=ih*(obs[d]||0)/maxv,eh=ih*(exp[d]||0)/maxv,y0=pad*0.4+ih;
    const flagged=d===b.flagged_digit;
    return `<rect x="${x+bw*0.18}" y="${y0-oh}" width="${bw*0.42}" height="${oh}" fill="${flagged?'var(--sev-high)':'var(--steel)'}"><title>digit ${d}: observed ${obs[d]||0}</title></rect>
      <rect x="${x+bw*0.60}" y="${y0-eh}" width="${bw*0.22}" height="${eh}" fill="var(--ramp-3)"><title>digit ${d}: Benford expected ${exp[d]||0}</title></rect>
      <text x="${x+bw*0.5}" y="${H-6}" text-anchor="middle" font-family="DM Mono" font-size="10" fill="var(--tx-2)">${d}</text>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;max-width:480px">${bars}</svg>
   <div class="net-legend"><span><span class="lg-dot" style="background:var(--steel)"></span> observed</span><span><span class="lg-dot" style="background:var(--ramp-3)"></span> Benford expected</span><span><span class="lg-dot" style="background:var(--sev-high)"></span> over-represented digit (${b.flagged_digit})</span></div>`;}
function netGraph(net){const nodes=net.nodes||[],edges=net.edges||[];if(!nodes.length)return '';
  const W=440,H=240,cx=W/2,cy=H/2,R=78,pos={};
  nodes.forEach((n,i)=>{const a=-Math.PI/2+i*2*Math.PI/nodes.length;pos[n.id]=[cx+R*Math.cos(a),cy+R*Math.sin(a)];});
  const types=[...new Set(edges.map(e=>e.type))];const PAL=['#99AFBC','#98AA3A','#6699CC','#993467'];
  const col=t=>PAL[types.indexOf(t)%PAL.length];
  const el=edges.map(e=>{const a=pos[e.s],b=pos[e.t];if(!a||!b)return'';return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${col(e.type)}" stroke-width="1.6" opacity="0.72"><title>${esc(e.type)}</title></line>`;}).join('');
  const nd=nodes.map(n=>{const p=pos[n.id];const r=n.has_case?9:7;const below=p[1]>cy;const lab=(n.label||'').length>18?n.label.slice(0,17)+'…':n.label;
    return `<circle cx="${p[0]}" cy="${p[1]}" r="${r}" fill="${n.has_case?'#C62828':'#2E5A8A'}"><title>${esc(n.label)} (${n.kind})</title></circle><text x="${p[0]}" y="${below?p[1]+r+12:p[1]-r-6}" text-anchor="middle" class="nlbl">${esc(lab)}</text>`;}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:var(--bg);border:1px solid var(--border);border-radius:6px">${el}${nd}</svg>`;}

function patInvestigate(code){const p=DATA.tier2.find(x=>x.code===code);if(!p)return;const ins=!p.baseline_sufficient;
  document.getElementById('modal').className='modal wide';
  document.getElementById('modal').innerHTML=`
   <div class="modal-h">${ring(p.confidence,p.confidence>=60?'medium':'low',48)}
     <div><div style="font-size:16px;font-weight:600">${esc(p.title)} <span class="tag tag-indic">Indicative &middot; Tier-2</span></div>
       <div class="mono" style="font-size:12px;color:var(--tx-2);margin-top:3px">${esc(p.subject)} &middot; ${p.level} &middot; confidence ${p.confidence}${ins?' &middot; baseline thin':''}</div></div>
     <button class="x" onclick="closeOv()">&times;</button></div>
   <div class="modal-b">
     <div class="sec-cap" style="margin-top:0">What this means</div><div class="means">${esc(p.what)}</div>
     <div class="sec-cap">Why this was flagged (Xa)</div>
     <div class="xa"><div class="xa-h">Xa &middot; pattern basis <span class="tagr">learned baseline, robust statistics &middot; no fresh analysis</span></div>
       <div class="xa-b"><b>Metric:</b> ${esc(p.metric)}<br><b>Baseline:</b> ${esc(p.baseline)} ${ins?'<span class="gate">insufficient baseline, gated</span>':''}<br><b>Dedup:</b> records already caught by a deterministic rule are excluded from this lead.</div></div>
     ${p.kind==='benford'&&p.benford?`<div class="sec-cap">First-digit distribution vs Benford</div>${benfordChart(p.benford)}`:''}
     ${p.kind==='afterhours'&&p.afterhours?`<div class="sec-cap">After-hours events</div>
       <table class="tbl"><thead><tr><th>User</th><th>Action</th><th>Timestamp</th><th>Weekend</th></tr></thead>
        <tbody>${p.afterhours.map(e=>`<tr><td class="mono">${esc(e.user)}</td><td>${esc(e.action)}</td><td class="mono">${esc(e.ts)}</td><td class="mono">${e.weekend?'yes':'no'}</td></tr>`).join('')}</tbody></table>`:''}
     ${p.kind==='network'?`<div class="sec-cap">Relationship graph</div><div style="max-width:520px">${netGraph(p.network)}</div>
       <div class="sec-cap">Shared identifiers</div><div class="triband"><div class="tri"><div class="tk">shared bank account</div><div class="tv">${esc(p.network.shared.bank_account)}</div></div><div class="tri"><div class="tk">shared registered address</div><div class="tv">${esc(p.network.shared.address)}</div></div><div class="tri"><div class="tk">linked parties</div><div class="tv">${p.network.nodes.length} nodes</div></div></div>`:''}
     <div class="sec-cap">Contributing factors</div><div class="facts">${p.factors.map(f=>`<span class="fact">${esc(f)}</span>`).join('')}</div>
     <div class="sec-cap">Suggested procedures (AI)</div><ol class="proc">${p.procedures.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
     ${p.data_dependency?`<div class="dep" style="margin-top:12px"><b>Data dependency:</b> ${esc(p.data_dependency)}</div>`:''}
     <div class="dispo-btns"><button class="btn btn-primary" onclick="promoteLead('${p.code}');closeOv()">Promote to workbench</button><button class="btn" onclick="closeOv()">Close</button></div>
     <div class="foot" style="margin-top:8px">Tier-2 lead &middot; indicative, lower confidence &middot; corroborate before any conclusion &middot; synthetic dataset.</div>
   </div>`;
  document.getElementById('ov').classList.add('on');logAudit('pattern.investigate',p.code,p.subject);
}
function promoteLead(code){const p=DATA.tier2.find(x=>x.code===code);if(!p)return;
  if(DATA.cases.find(c=>c.origin==='pattern'&&c.pat_code===code)){toast('Already promoted, '+code+' is in the workbench');setTab('workbench');return;}
  const sev=p.confidence>=60?'medium':'low';
  const c={id:'PRM-PAT-'+(PATSEQ++),tier:2,origin:'pattern',pat_code:code,family:'pattern',indicator:code,indicator_short:p.title,
    severity:sev,score:p.confidence,score_parts:[{code:'confidence',pts:p.confidence}],vendor:p.subject,vendor_id:p.subject_id||'-',
    category:p.level,company_code:'-',plant:'-',exposure:p.exposure,exposure_disp:p.exposure_disp,txns:p.txns,age_days:0,sla_days:14,
    assignee:'Unassigned',status:'Detected',planted:false,what:p.what,xa:p.metric,feeds:['Pattern baseline (learned)','Vendor master (LFA1)','PO history (EKBE)'],
    procedures:p.procedures,chain:[],break_step:null,month:DATA.meta.today.slice(0,7),docs:[],network:p.network||null};
  DATA.cases.unshift(c);SEL=c.id;logAudit('pattern.promote',c.id,p.title+' ('+p.subject+')');toast('Promoted to workbench, '+c.id);setTab('workbench');
}

/* ---------- DISPOSITION (maker-checker) ---------- */
let DISPSUB='dispositions', DISPFILTER='';
function dispStPill(c){const map={'Escalated':'sev-high','False positive':'sev-norisk','Cleared':'sev-medium','Confirmed risk':'sev-critical'};
  const lbl=c.status==='Escalated'?'Escalated':(c.outcome||c.status);const cls=map[lbl]||'sev-norisk';
  return `<span class="sev ${cls}" style="font-weight:600">${esc(lbl).toUpperCase()}</span>`;}
function wfChip(c){const d=c.days_in_workflow!=null?c.days_in_workflow:c.age_days;const br=(c.status==='Escalated'&&d>c.sla_days);
  return `<span class="pin ${br?'warn':''}">${c.status==='Escalated'?`Age ${d}d · SLA ${c.sla_days}d${br?' · PAST SLA':''}`:`TAT ${c.tat!=null?c.tat:d}d`}</span>`;}
function renderDisposition(){
  const esc0=DATA.cases.filter(c=>c.status==='Escalated');
  const fp=DATA.cases.filter(c=>c.outcome==='False positive');
  const cl=DATA.cases.filter(c=>c.outcome==='Cleared');
  const conf=DATA.cases.filter(c=>c.outcome==='Confirmed risk');
  const closed=[...fp,...cl,...conf];
  const avgTat=closed.length?Math.round(closed.reduce((s,c)=>s+(c.tat!=null?c.tat:c.days_in_workflow||0),0)/closed.length):null;

let DCTX=null;
function openDispo(id,action){DCTX={id,action:action||'Escalate'};const c=caseById(id);const hi=(c.severity==='critical'||c.severity==='high');
  document.getElementById('dmodal').className='modal narrow';
  document.getElementById('dmodal').innerHTML=`
   <div class="modal-h"><div style="font-size:15px;font-weight:600">${DCTX.action} &middot; ${c.id}</div><button class="x" onclick="closeDispo()">&times;</button></div>
   <div class="modal-b"><div class="means" style="margin-bottom:10px">${esc(c.vendor)} &middot; ${c.indicator_short} &middot; ${sevTag(c.severity)}</div>
     <div class="rev-field"><label>Justification note (required)</label><textarea class="ta" id="dnote" placeholder="State the basis for this disposition..."></textarea>
       <div id="derr" style="color:var(--sev-critical);font-size:12px;margin-top:6px;display:none">A justification note is required.</div></div>
     ${DCTX.action==='Escalate'&&hi?'<div class="sod-note warn"><b>Maker-checker:</b> this is a high-severity case. Escalation routes to a second reviewer who must confirm or clear; the confirming reviewer must differ from you (segregation of duties).</div>':''}
     ${DCTX.action!=='Escalate'?'<div class="sod-note">This disposition closes the case and writes to the audit trail. A Confirmed risk, if later escalated, is locked and read-only.</div>':''}
     <div class="dispo-btns" style="margin-top:14px"><button class="btn btn-primary" onclick="commitDispo()">Confirm ${DCTX.action}</button><button class="btn" onclick="closeDispo()">Cancel</button></div></div>`;
  document.getElementById('dov').classList.add('on');
}
function closeDispo(){document.getElementById('dov').classList.remove('on');}
function commitDispo(){const note=document.getElementById('dnote').value.trim();if(!note){document.getElementById('derr').style.display='block';return;}
  const c=caseById(DCTX.id);c.disp_note=note;c.reviewer=c.reviewer||ROLE;
  if(DCTX.action==='Escalate'){c.status='Escalated';c.escalated_by=ROLE;c.disp_reason='Escalated for review';logAudit('case.escalate',c.id,'note: '+note);toast('Escalated '+c.id+' for second review');}
  else if(DCTX.action==='False positive'){c.status='Resolved';c.outcome='False positive';c.disp_reason='Cleared as false positive';c.tat=c.days_in_workflow;logAudit('case.false_positive',c.id,'note: '+note);toast('Marked false positive, '+c.id);}
  else{c.status='Resolved';c.outcome='Cleared';c.disp_reason='Cleared, no concern';c.tat=c.days_in_workflow;logAudit('case.clear',c.id,'note: '+note);toast('Cleared '+c.id);}
  closeDispo();closeOv();render();
}
function openReview(id){const c=caseById(id);
  document.getElementById('dmodal').className='modal narrow';
  const sameUser=(c.escalated_by===ROLE);
  document.getElementById('dmodal').innerHTML=`
   <div class="modal-h"><div style="font-size:15px;font-weight:600">Review &middot; ${c.id}</div><button class="x" onclick="closeDispo()">&times;</button></div>
   <div class="modal-b"><div class="means" style="margin-bottom:10px">${esc(c.vendor)} &middot; ${c.indicator_short} &middot; ${sevTag(c.severity)} &middot; escalated by ${esc(c.escalated_by||'analyst')}</div>
     ${sameUser?`<div class="sod-note warn"><b>Segregation of duties:</b> you escalated this case, so you cannot be the confirming reviewer. Switch acting role (top-right) to a different reviewer to confirm or clear.</div>`:''}
     <div class="rev-field"><label>Reviewer decision</label><select id="rdec" ${sameUser?'disabled':''}><option value="Confirmed risk">Confirm risk (lock case)</option><option value="Cleared">Clear</option></select></div>
     <div class="rev-field"><label>Reviewer note (required)</label><textarea class="ta" id="rnote" ${sameUser?'disabled':''} placeholder="Basis for the review decision..."></textarea>
       <div id="rerr" style="color:var(--sev-critical);font-size:12px;margin-top:6px;display:none">A reviewer note is required.</div></div>
     <div class="dispo-btns" style="margin-top:14px"><button class="btn btn-primary" ${sameUser?'disabled style="opacity:.5"':''} onclick="commitReview('${c.id}')">Confirm decision</button><button class="btn" onclick="closeDispo()">Cancel</button></div></div>`;
  document.getElementById('dov').classList.add('on');
}
function commitReview(id){const c=caseById(id);const dec=document.getElementById('rdec').value;const note=document.getElementById('rnote').value.trim();
  if(!note){document.getElementById('rerr').style.display='block';return;}
  c.status='Resolved';c.outcome=dec;c.reviewed_by=ROLE;c.reviewer=ROLE;c.disp_note=note;c.tat=c.days_in_workflow;
  c.disp_reason=dec==='Confirmed risk'?'Confirmed as risk':'Cleared on review';c.confirmed_ts=new Date().toISOString().slice(0,10);
  logAudit('case.review',c.id,dec+' by '+ROLE+' — note: '+note);
  toast(dec==='Confirmed risk'?'Confirmed risk, '+c.id+' locked':'Cleared on review, '+c.id);closeDispo();render();
}

    <tbody>${top.map(c=>`<tr><td class="mono">${c.id}</td><td>${esc(c.vendor)}</td><td>${c.indicator_short}</td><td>${sevTag(c.severity)}</td><td class="mono">${c.exposure_disp}</td></tr>`).join('')}</tbody></table>
   <div class="sec-cap">5. Recovery &amp; leakage</div>
   <div class="means">Of the ${k.total_exposure} flagged exposure, approximately ${DATA.recovery.recoverable_total_disp} (${DATA.recovery.pct_of_exposure}%) is assessed recoverable, duplicate payments, invoice overcharges and cost-of-capital on early payment, with a further ${DATA.recovery.avoidable_total_disp} of avoidable spend identified by price benchmarking. Control-only signals are excluded from recovery. Amounts are flagged, not confirmed loss; cost of capital assumed ${DATA.recovery.cost_of_capital}%.</div>

 {n:'Enterprise API (zero-retention)',p:'Anthropic Claude · enterprise agreement',d:"Prompts are sent to the provider's hosted model under a contractual no-training, zero-retention agreement. Data is not stored beyond the request and is never used for training.",t:'Frontier model quality · lowest operational burden · fastest to deploy.',f:'Most enterprise buyers with a standard data-handling agreement.'},

const ASK_EX=['Which cases have the highest exposure?','Show me the price variance signals','How many duplicate-invoice cases are open?','What is the detection precision and recall?','Tell me about the related-party network'];
function renderDrawer(){if(document.getElementById('drawer-b').dataset.init)return;document.getElementById('drawer-b').dataset.init='1';

function askSend(preset){const inp=document.getElementById('askin');const q=preset||inp.value.trim();if(!q)return;inp.value='';
  const b=document.getElementById('drawer-b');const r=answer(q);
  b.insertAdjacentHTML('beforeend',`<div class="msg u">${esc(q)}</div>`);

function answer(q){const s=q.toLowerCase();const det=DATA.detection.overall;
  const sevM=s.match(/\b(critical|high|medium|low)\b/);
  const idM=q.match(/\bPRM-[A-Z0-9-]+/i);if(idM){const c=caseById(idM[0].toUpperCase());if(c)return{text:`${c.id}: ${c.indicator_short} on ${c.vendor}, ${SEVLABEL[c.severity]}, exposure ${c.exposure_disp}, status ${c.status}. ${c.xa}`,sql:`SELECT * FROM cases WHERE case_id='${c.id}'`};}
  if(/precision|recall|f1|detection quality|accuracy/.test(s))return{text:`Measured against planted ground truth: precision ${det.precision}%, recall ${det.recall}%, F1 ${det.f1} (TP ${det.tp}, FP ${det.fp}, FN ${det.fn}). Per-indicator figures are in Admin.`,sql:'SELECT precision, recall, f1 FROM eval_confusion_matrix'};
  if(/network|related.?party|front|cluster/.test(s)){const n=DATA.tier2.find(t=>t.kind==='network');return{text:`${n.title} (${n.code}): ${n.metric} Exposure ${n.exposure_disp}. Shown as a relationship graph in Pattern analysis. Indicative, corroborate before any conclusion.`,sql:"SELECT * FROM pattern_leads WHERE kind='network'"};}
  if(/exposure|value at risk|highest|top/.test(s)){const top=[...DATA.cases].sort((a,b)=>b.exposure-a.exposure).slice(0,3);return{text:`Total value at risk across open cases is ${DATA.kpis.total_exposure}. Highest: ${top.map(c=>`${c.vendor} (${c.exposure_disp}, ${c.indicator_short})`).join('; ')}.`,sql:'SELECT vendor, SUM(exposure) FROM cases GROUP BY vendor ORDER BY 2 DESC'};}
  if(/price variance/.test(s)){const n=DATA.cases.filter(c=>c.indicator==='PROC0308'||c.indicator==='PROC0309');return{text:`${n.length} price-variance cases are open across PO-to-PO (PROC0308) and PO-to-invoice (PROC0309), combined exposure ${inrSum(n)}.`,sql:"SELECT * FROM cases WHERE indicator IN ('PROC0308','PROC0309')"};}
  if(/duplicate/.test(s)){const r=DATA.register.find(x=>x.code==='PROC0148');return{text:`${r.count} duplicate-invoice cases (PROC0148) are open, exposure ${r.exposure_disp}.`,sql:"SELECT * FROM cases WHERE indicator='PROC0148'"};}
  if(/maverick|off.?po/.test(s)){const r=DATA.register.find(x=>x.code==='PROC0220');return{text:`${r.count} maverick / off-PO spend cases (PROC0220) are open, exposure ${r.exposure_disp}.`,sql:"SELECT * FROM cases WHERE indicator='PROC0220'"};}
  if(/early payment|discount/.test(s)){const r=DATA.register.find(x=>x.code==='PROC0412');return{text:`${r.count} early-payment-without-discount cases (PROC0412) are open, exposure ${r.exposure_disp}.`,sql:"SELECT * FROM cases WHERE indicator='PROC0412'"};}
  if(/over.?order|stock|inventory/.test(s)){const r=DATA.register.find(x=>x.code==='PROC0356');return{text:`${r.count} over-ordering-vs-stock cases (PROC0356) are open, exposure ${r.exposure_disp}.`,sql:"SELECT * FROM cases WHERE indicator='PROC0356'"};}
  if(sevM){const sv=sevM[1];const n=DATA.cases.filter(c=>c.severity===sv);return{text:`${n.length} ${sv}-severity cases are open, combined exposure ${inrSum(n)}.`,sql:`SELECT * FROM cases WHERE severity='${sv}'`};}
  if(/how many|count|open case/.test(s))return{text:`${DATA.cases.length} cases are open across ${DATA.register.length} indicators, plus ${DATA.tier2.length} Tier-2 pattern leads. Aggregate exposure ${DATA.kpis.total_exposure}.`,sql:'SELECT COUNT(*) FROM cases'};
  if(/pattern|tier.?2|lead/.test(s))return{text:`${DATA.tier2.length} Tier-2 pattern leads are active, each learned on the subject's own baseline and deduped against rule hits, including a related-party network. Indicative, corroborate before any conclusion.`,sql:'SELECT * FROM pattern_leads'};
  return{text:`I answer from the governed anomaly DB on cases, vendors, signals, exposure and detection quality. Try: value at risk, a specific indicator, the network lead, or precision and recall. I reproduce evidence and do not draw conclusions, those are for analyst review.`};}
function inrSum(list){const v=list.reduce((a,c)=>a+c.exposure,0);if(v>=1e7)return 'Rs '+(v/1e7).toFixed(2)+' Cr';if(v>=1e5)return 'Rs '+(v/1e5).toFixed(1)+' L';if(v>=1e3)return 'Rs '+(v/1e3).toFixed(1)+' K';return 'Rs '+v.toFixed(0);}

<script id="fortifai-inline-clean-script-v5">
(function(){
  const KILL_TEXT = [
    'board report', 'board dossier', 'board pack',
    'export (.xls)', 'export (.xlsx)', 'export cfo pack', 'export csv', 'export pdf',
    'ask kuber', 'ask sara', 'ask crystal', 'ask moneta', 'ask aegis', 'ask veritas', 'ask argus', 'ask agent',
    'live sap', 'read-only sap', 'external audit',
    '? guide', 'user guide', 'cockpit guide',
    'suppressed fp'
  ];

  function nukeClutter() {
    // 1. Hide noisy header buttons & pills unconditionally (no rect check, any child count <= 5)
    document.querySelectorAll('button, a, span, div').forEach(el => {
      if (el.tagName === 'SELECT' || el.closest('table, tbody, .drawer, .modal-card, [class*="modal"], [class*="drawer"]')) return;
      if (el.children.length > 5) return;
      // Skip wrapper divs that also contain the currency buttons or brand logo
      const raw = (el.textContent || '').replace(/\s+/g, ' ').trim().toLowerCase();
      if (!raw || raw.length > 32) return;
      if (raw.includes('usd') || raw.includes('inr') || raw.includes('fortifai')) return;

      if (KILL_TEXT.some(k => raw === k || raw.includes(k))) {
        el.style.setProperty('display', 'none', 'important');
      }
    });

    // 2. Hide numeric count pills ("14", "22") inside Tabs
    document.querySelectorAll('button, a, div, li, [role="tab"]').forEach(tab => {
      const txt = (tab.textContent || '').replace(/\s+/g, ' ').trim();
      if (tab.children.length >= 1 && tab.children.length <= 4 && txt.length > 4 && txt.length < 42) {
        if (txt.includes('Workbench') || txt.includes('Actions Hub') || txt.includes('Overview') || txt.includes('Queue') || tab.classList.contains('tab')) {
          tab.querySelectorAll('span, b, small, em').forEach(b => {
            if (/^\(?\d+\)?$/.test((b.textContent || '').trim())) {
              b.style.setProperty('display', 'none', 'important');
            }
          });
        }
      }
    });

    // 3. Hide small-font helper lines & long grey descriptions
    document.querySelectorAll('p, div, small, span').forEach(el => {
      if (el.closest('svg') || el.previousElementSibling?.tagName === 'svg') return;
      if (el.children.length === 0 && !el.closest('.drawer, .modal-card, [class*="modal"], [class*="drawer"]')) {
        const txt = (el.textContent || '').trim();
        if (!txt) return;
        const low = txt.toLowerCase();
        if (low.startsWith('click any kpi') || low.startsWith('click any bubble') || low.startsWith('click any row')) {
          el.style.setProperty('display', 'none', 'important');
          return;
        }
        const fs = parseFloat(window.getComputedStyle(el).fontSize || '13');
        if (fs <= 11.5 && txt.length > 68 && !el.closest('td.mono, th, code')) {
          el.style.setProperty('display', 'none', 'important');
        }
      }
    });
  }

  // Universal USD <-> INR converter (1 USD M = 8.35 Cr)
  const FX = 8.35;
  function convertCurrency(mode) {
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(node => {
      const p = node.parentElement;
      if (!p || ['SCRIPT', 'STYLE', 'CODE', 'PRE'].includes(p.tagName)) return;
      const pt = (p.textContent || '').trim();
      if (['$ USD', '₹ INR', '₹ Cr', 'INR', 'USD'].includes(pt)) return;
      if (node._origCur === undefined) {
        if (/[₹$]/.test(node.nodeValue)) node._origCur = node.nodeValue;
        else return;
      }
      const orig = node._origCur;
      if (!orig) return;
      if (mode === 'USD') {
        let u = orig.replace(/₹\s?([\d,]+(?:\.\d+)?)\s*Cr\b/gi, (_, n) => {
          const cr = parseFloat(n.replace(/,/g, ''));
          if (isNaN(cr)) return _;
          const m = cr / FX;
          return m >= 1 ? '$' + m.toFixed(m >= 10 ? 1 : 2).replace(/\.00$/, '.0') + 'M' : (m === 0 ? '$0M' : '$' + Math.round(m * 1000) + 'K');
        });
        u = u.replace(/₹\s?([\d,]+(?:\.\d+)?)\s*L\b/gi, (_, n) => '$' + Math.round((parseFloat(n.replace(/,/g, '')) * 100000) / 83.5 / 1000) + 'K');
        if (node.nodeValue !== u) node.nodeValue = u;
      } else {
        if (orig.includes('₹')) {
          if (node.nodeValue !== orig) node.nodeValue = orig;
        } else {
          let u = orig.replace(/\$\s?([\d,]+(?:\.\d+)?)\s*M\b/gi, (_, n) => '₹' + (parseFloat(n.replace(/,/g, '')) * FX).toFixed(1) + ' Cr');
          if (node.nodeValue !== u) node.nodeValue = u;
        }
      }
    });
  }

  function wireCurrency() {
    document.querySelectorAll('button, span, a, div').forEach(btn => {
      if (btn.dataset.curV5 || btn.children.length > 1) return;
      const t = (btn.textContent || '').replace(/\s+/g, ' ').trim();
      if (['$ USD', 'USD', '₹ INR', 'INR', '₹ Cr'].includes(t)) {
        btn.dataset.curV5 = '1';
        btn.addEventListener('click', () => {
          const mode = t.includes('USD') ? 'USD' : 'INR';
          setTimeout(() => convertCurrency(mode), 30);
          setTimeout(() => convertCurrency(mode), 180);
        });
      }
    });
  }

  function boot() { nukeClutter(); wireCurrency(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  window.addEventListener('load', () => { boot(); setTimeout(boot, 300); setTimeout(boot, 900); });
  let tm;
  new MutationObserver(() => { clearTimeout(tm); tm = setTimeout(boot, 80); }).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
